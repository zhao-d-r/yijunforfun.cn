<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yijun · 赵逸君</title>
<meta name="description" content="赵逸君的个人主页：产品经理转型 AI builder，这里放我做的东西。">
<style>
:root{--ink:#141414;--gray:#767676;--line:#ececec;--hl:#ffe9a8;
--sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
--display:Georgia,'Times New Roman','Songti SC',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 28px}
header{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-style:italic;font-size:40px;line-height:1.1}
.logo span{display:block;font-family:var(--sans);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.32em;color:var(--gray);margin-top:10px}
.intro{margin-top:26px;font-size:17px;line-height:1.8;color:#333;max-width:560px}
.intro mark{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
h2{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--gray);margin:44px 0 18px}
.list{display:flex;flex-direction:column}
.item{display:block;padding:20px 0;border-bottom:1px solid var(--line)}
.item:hover .t{text-decoration:underline;text-underline-offset:5px}
.t{font-family:var(--display);font-size:22px;line-height:1.25}
.t small{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gray);margin-left:10px;vertical-align:middle}
.d{margin-top:8px;font-size:14px;line-height:1.7;color:#555}
footer{padding:48px 0 64px;font-size:12px;color:var(--gray);letter-spacing:.06em}
footer a{border-bottom:1px solid var(--line)}
@media (max-width:520px){header{padding:44px 0 30px}.logo{font-size:32px}.t{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">Yijun<span>赵逸君 · PRODUCT → AI BUILDER</span></div>
  <p class="intro">做过多年产品经理，现在用 AI 亲手把想法做成东西。<mark>这里放我做的产品和写的东西</mark>，都是能打开直接用的。</p>
</header>

<h2>作品</h2>
<div class="list">
  <a class="item" href="/taste/">
    <div class="t">Valley Beacon<small>每日一条</small></div>
    <div class="d">AI 替我听播客、读订阅，这里只放我亲自盖章推荐的那部分。每天一张海报大卡和一句推荐语。</div>
  </a>
  <a class="item" href="https://cognitive-flywheel.vercel.app/" target="_blank" rel="noopener">
    <div class="t">认知飞轮<small>需科学上网</small></div>
    <div class="d">我的个人 AI 知识库：读过、听过、想过的东西如何滚成一个飞轮。</div>
  </a>
  <a class="item" href="https://github.com/zhao-d-r/feynman-for-ai-builders-cn" target="_blank" rel="noopener">
    <div class="t">Feynman for AI Builders<small>GitHub</small></div>
    <div class="d">装进 Claude Code 的学习引擎：你用 AI 造产品，费曼让你真正懂它。中文版。</div>
  </a>
</div>

<footer>© 2026 Yijun · <a href="https://github.com/zhao-d-r" target="_blank" rel="noopener">GitHub</a></footer>
</div>
</body>
</html>
