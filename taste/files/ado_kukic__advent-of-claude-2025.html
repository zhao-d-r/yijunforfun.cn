<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advent of Claude：31 天 Claude Code 功能全景手册</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- 自绘流程图渲染器(见 renderFlowcharts):读 .mermaid 里的 flowchart 源码,
     解析→分层布局→卡片+SVG 箭头。不再加载 mermaid CDN(更好看 + 去掉 loose XSS 面)。 -->
<style>
  /* ====== Claude-inspired design tokens (与 ai-podcast-listener 同族) ====== */
  :root {
    --bg: #fafaf7;
    --bg-card: #ffffff;
    --fg: #1c1917;
    --fg-secondary: #44403c;
    --muted: #78716c;
    --muted-soft: #a8a29e;
    --accent: #B45309;
    --accent-bg: #fef3c7;
    --border: #e7e5e4;
    --border-soft: #f5f5f4;
    --green: #15803d;
    --red: #dc2626;
    --yellow: #ca8a04;
    --serif: 'Charter', 'Iowan Old Style', 'PingFang SC', 'Noto Serif SC', Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  html.dark {
    --bg: #0c0a09;
    --bg-card: #1c1917;
    --fg: #f5f5f4;
    --fg-secondary: #d6d3d1;
    --muted: #a8a29e;
    --muted-soft: #78716c;
    --accent: #fbbf24;
    --accent-bg: #422006;
    --border: #292524;
    --border-soft: #1c1917;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.75;
    font-feature-settings: "kern", "liga", "calt";
  }
  .ui { font-family: var(--sans); }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  .text-muted { color: var(--muted); }
  .accent { color: var(--accent); }

  /* Hero */
  .hero-title { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }

  .badge {
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px; display: inline-block;
  }
  .mode-badge { background: var(--accent-bg); color: var(--accent); }

  .section-heading {
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 24px; margin-top: 56px; margin-bottom: 24px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .section-heading .num { color: var(--accent); font-weight: 700; margin-right: 4px; }
  .section-subhead {
    font-family: var(--sans); font-size: 14px; color: var(--muted);
    margin-top: -16px; margin-bottom: 24px; font-style: italic;
  }

  /* TLDR */
  .tldr-block {
    font-family: var(--serif); font-size: 24px; line-height: 1.5;
    padding: 24px 0 16px;
    border-top: 2px solid var(--fg);
  }
  .worth-row {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    padding: 12px 0 20px; border-bottom: 1px solid var(--border);
    font-family: var(--sans); font-size: 14px; color: var(--fg-secondary);
  }

  /* Narrative (导读故事) */
  .narrative-block { font-family: var(--serif); font-size: 17.5px; line-height: 1.9; }
  .narrative-block p { margin-bottom: 1.1em; }
  .narrative-block p:first-of-type::first-letter {
    font-size: 2.6em; line-height: 1; float: left; padding-right: 8px; margin-top: 2px;
    color: var(--accent); font-weight: 600;
  }

  /* The one insight (带走一句) */
  .insight-hero {
    margin: 8px 0 16px; padding: 36px 40px; border-radius: 14px;
    background: var(--accent-bg); position: relative;
  }
  .insight-hero .itext {
    font-family: var(--serif); font-size: 27px; line-height: 1.5; font-weight: 600; color: var(--fg);
  }
  .insight-hero .ilabel {
    font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
  }

  /* Key numbers */
  .kn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .kn-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px 14px;
  }
  .kn-metric { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.03em; margin-bottom: 6px; }
  .kn-value { font-family: var(--mono); font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--fg); }
  .kn-value.kn-md { font-size: 19px; }
  .kn-value.kn-sm { font-size: 15.5px; line-height: 1.45; }
  .kn-context { font-family: var(--sans); font-size: 12.5px; line-height: 1.55; color: var(--fg-secondary); margin-top: 8px; }
  .kn-page { font-family: var(--mono); font-size: 10.5px; color: var(--muted-soft); margin-top: 8px; }

  /* Question card */
  .question-card {
    border-left: 3px solid var(--accent); padding: 20px 24px; margin-bottom: 32px;
    background: var(--bg-card); border-radius: 0 8px 8px 0;
  }
  .question-num {
    font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 8px; display: block;
  }
  .question-text { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 16px; }
  .question-approach, .question-answer {
    font-size: 15px; line-height: 1.7; padding: 12px 16px; border-radius: 6px; margin-top: 12px;
  }
  .question-approach { background: var(--border-soft); color: var(--fg-secondary); }
  .question-answer { background: var(--accent-bg); }
  .label-pill {
    font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px;
  }

  /* Premise rows */
  .premise { border-left: 2px solid var(--border); padding: 4px 0 4px 20px; margin-bottom: 24px; transition: border-color .2s; }
  .premise:hover { border-left-color: var(--accent); }
  .premise-point { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.4; margin-bottom: 8px; }
  .premise-explanation { font-size: 15px; line-height: 1.7; color: var(--fg-secondary); }
  .page-ref { font-family: var(--mono); font-size: 11px; color: var(--muted-soft); margin-left: 8px; white-space: nowrap; }

  /* Mermaid */
  .mental-block { margin-bottom: 56px; }
  .mental-name { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 10px; }
  .mental-description { font-size: 15px; line-height: 1.7; color: var(--fg-secondary); margin-bottom: 20px; }
  .mermaid-frame {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 20px; margin: 16px 0; display: flex; justify-content: center; overflow-x: auto;
  }
  .mermaid-frame .mermaid { max-width: 100%; }
  .mermaid-caption { font-family: var(--sans); font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; font-style: italic; }
  .application-callout { background: var(--accent-bg); border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
  .application-callout .label {
    font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 14px; }
  .data-table th {
    text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); padding: 8px 12px;
    border-bottom: 2px solid var(--border);
  }
  .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table .num { font-family: var(--mono); white-space: nowrap; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  /* Rating box (broker research) */
  .rating-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 28px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center;
  }
  .rating-item .rlabel { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .rating-item .rvalue { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .rating-item .rvalue.mono { font-family: var(--mono); }

  /* Callout boxes */
  .warn-box { margin-top: 20px; padding: 16px 20px; border-radius: 8px;
    background: color-mix(in srgb, #f87171 10%, transparent); border-left: 3px solid var(--red); }
  .warn-box .label { font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
  .warn-box .body { font-size: 14.5px; line-height: 1.7; color: var(--fg-secondary); }
  .warn-box ul { padding-left: 18px; font-size: 14.5px; line-height: 1.7; color: var(--fg-secondary); }
  .info-box { margin-top: 20px; padding: 16px 20px; border-radius: 8px;
    background: var(--border-soft); border-left: 3px solid var(--muted); }
  .info-box .label { font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  /* Evidence / assumption cards */
  .evidence-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 16px;
  }
  .evidence-claim { font-family: var(--serif); font-weight: 600; font-size: 16.5px; line-height: 1.45; }
  .evidence-detail { font-size: 14px; line-height: 1.65; color: var(--fg-secondary); margin-top: 8px; }
  .strength-badge { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 3px; margin-left: 8px; vertical-align: 2px; }
  .strength-strong { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
  .strength-moderate { background: color-mix(in srgb, var(--yellow) 18%, transparent); color: var(--yellow); }
  .strength-weak { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }

  /* Reading map */
  .rmap-item { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); align-items: baseline; }
  .rmap-item:last-child { border-bottom: none; }
  .rmap-pages { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 76px; flex-shrink: 0; }
  .rmap-verdict { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 3px; flex-shrink: 0; min-width: 44px; text-align: center; }
  .v-deep { background: var(--accent); color: #fff; }
  html.dark .v-deep { color: #1c1917; }
  .v-skim { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .v-skip { background: var(--border-soft); color: var(--muted-soft); }
  .rmap-body .rmap-section { font-family: var(--serif); font-weight: 600; font-size: 15.5px; }
  .rmap-body .rmap-summary { font-size: 13.5px; color: var(--fg-secondary); font-family: var(--sans); margin-top: 2px; }
  .rmap-body .rmap-why { font-size: 12px; color: var(--muted); font-family: var(--sans); font-style: italic; }

  /* Fine print severity */
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; margin-top: 9px; }
  .dot-red { background: var(--red); } .dot-yellow { background: var(--yellow); } .dot-info { background: var(--muted-soft); }

  /* Critical lens */
  .lens-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .lens-grid { grid-template-columns: 1fr; } }
  .lens-col { border-radius: 10px; padding: 20px 24px; background: var(--bg-card); border: 1px solid var(--border); }
  .lens-col .ltitle { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
  .lens-col ul { padding-left: 18px; font-size: 14.5px; line-height: 1.7; color: var(--fg-secondary); }
  .lens-col li { margin-bottom: 8px; }

  /* Playbook steps */
  .playbook-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 32px; }
  .playbook-name { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .playbook-when { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .step-list { counter-reset: step; }
  .step-item { position: relative; padding-left: 48px; padding-bottom: 20px; counter-increment: step; }
  .step-item:not(:last-child)::after { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: var(--border); }
  .step-item::before {
    content: counter(step); position: absolute; left: 0; top: 0; width: 36px; height: 36px;
    border-radius: 50%; background: var(--accent-bg); color: var(--accent);
    font-family: var(--sans); font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .step-title { font-family: var(--serif); font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .step-detail { font-size: 14px; line-height: 1.7; color: var(--fg-secondary); }

  /* Quick start / checklist */
  .quickstart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); font-size: 15px; line-height: 1.6; }
  .quickstart-item:last-child { border-bottom: none; }
  .quickstart-item .check { color: var(--accent); font-size: 18px; line-height: 1.4; flex-shrink: 0; }

  /* Pull quote */
  .pullquote { margin: 32px 0; padding: 8px 0 8px 32px; border-left: 4px solid var(--accent); position: relative; }
  .pullquote-text { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.55; }
  .pullquote-attribution { font-family: var(--sans); font-size: 13px; color: var(--muted); margin-top: 10px; }
  .pullquote-note { font-family: var(--sans); font-size: 13px; color: var(--fg-secondary); margin-top: 6px; }

  /* References */
  .glossary-row { display: grid; grid-template-columns: 180px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  .glossary-row:last-child { border-bottom: none; }
  .glossary-term { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }
  .glossary-definition { color: var(--fg-secondary); line-height: 1.6; }
  .reading-item { padding: 10px 0; border-bottom: 1px solid var(--border-soft); display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
  .reading-item:last-child { border-bottom: none; }
  .reading-type { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-bg); padding: 2px 8px; border-radius: 3px; flex-shrink: 0; min-width: 60px; text-align: center; }
  .reading-name { font-weight: 600; }
  .reading-note { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* TOC */
  .toc-link { font-family: var(--sans); font-size: 13px; color: var(--muted); transition: color .15s; padding: 4px 0; display: block; }
  .toc-link:hover, .toc-link.active { color: var(--accent); }
  .toc-link.active { font-weight: 600; }

  @media print {
    .no-print { display: none !important; }
    body { font-size: 12pt; }
    .question-card, .playbook-block, .mermaid-frame, .kn-card, .evidence-card, .rating-box { break-inside: avoid; }
  }
  section[id] { scroll-margin-top: 80px; }
</style>
<style>
#mtbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--bg,#fafaf7);border-bottom:1px solid var(--border,#e7e5e4);font-family:var(--sans,ui-sans-serif,system-ui,sans-serif);font-size:12px;color:var(--muted,#78716c);transition:padding .18s ease,box-shadow .18s ease}
#mtbar a{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 12px;margin-left:-12px;color:var(--fg,#1c1917);text-decoration:none;border-radius:9px}
#mtbar a:hover{background:var(--border-soft,#f5f5f4)}
#mtbar a i{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:16px}
#mtprog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent,#B45309);z-index:99;pointer-events:none}
.mt-original-title{margin-top:10px;font-family:var(--sans,ui-sans-serif,system-ui,sans-serif);font-size:15px;line-height:1.55;color:var(--muted,#78716c)}
nav.no-print.sticky,body>nav.sticky{transition:min-height .18s ease,box-shadow .18s ease}
html.mt-scrolled #mtbar{padding-top:4px;padding-bottom:4px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
html.mt-scrolled nav.no-print.sticky,html.mt-scrolled body>nav.sticky{box-shadow:0 8px 24px rgba(0,0,0,.08)}
html.mt-scrolled nav.no-print.sticky .max-w-6xl,html.mt-scrolled body>nav.sticky .max-w-6xl{padding-top:.35rem!important;padding-bottom:.35rem!important;min-height:40px!important}
#mttoc{display:none;align-items:center;justify-content:center;min-width:64px;height:44px;border:1px solid var(--border,#e7e5e4);background:var(--bg-card,#fff);color:var(--fg,#1c1917);border-radius:999px;font-size:12px;font-weight:700;font-family:var(--sans,ui-sans-serif,system-ui,sans-serif);cursor:pointer}
#mttop{position:fixed;right:16px;z-index:98;display:none;align-items:center;justify-content:center;border:1px solid var(--border,#e7e5e4);background:var(--bg-card,#fff);color:var(--fg,#1c1917);box-shadow:0 8px 24px rgba(0,0,0,.16);cursor:pointer}
#mttop{bottom:80px;width:46px;height:46px;border-radius:999px;font-size:16px}
@media (max-width:960px){#mttoc{display:flex}}
#mttop.show{display:flex}
#mtsheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42)}
#mtsheet .mtsheet-in{position:absolute;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;background:var(--bg,#fafaf7);border-radius:18px 18px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.mtsheet-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:4px 2px 10px;color:var(--fg,#1c1917);font-family:var(--sans,ui-sans-serif,system-ui,sans-serif)}
#mtclose{width:44px;height:44px;margin:-10px -10px -10px 0;border:0;background:none;font-size:15px;cursor:pointer;color:var(--muted,#78716c)}
#mtlinks a{display:flex;min-height:46px;align-items:center;padding:2px 8px;color:var(--fg-secondary,#44403c);text-decoration:none;font-size:14px;border-bottom:1px solid var(--border-soft,#f5f5f4);font-family:var(--sans,ui-sans-serif,system-ui,sans-serif)}
#mtlinks a:hover,#mtlinks a:active{background:var(--border-soft,#f5f5f4)}
@media (max-width:640px){
 body{padding-bottom:96px}
 #mtbar{position:sticky;top:0;z-index:97;padding:4px 14px;font-size:11px}
 #mtbar a{min-height:32px;padding:0 10px}
 #mtbar a i{font-size:14px}
 #mttoc{display:flex;height:44px;min-width:64px;padding:0 14px}
 .hero-title{font-size:30px!important;line-height:1.22!important;letter-spacing:0!important}
 .mt-original-title{font-size:14px!important;line-height:1.55!important;color:var(--muted,#57534e)!important}
 .tldr-block{font-size:18px!important;line-height:1.65!important;padding:18px 0!important}
 .question-card{padding:16px 18px!important;margin-bottom:24px!important}
 .question-text{font-size:18px!important;line-height:1.45!important;margin-bottom:12px!important}
 .question-approach,.question-answer{font-size:15px!important;line-height:1.65!important;padding:10px 12px!important}
 .premise-explanation,.mental-description,.slide-card figcaption{font-size:14px!important;line-height:1.65!important}
 #mttop{right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:44px;height:44px}
 nav.no-print.sticky .max-w-6xl,body>nav.sticky .max-w-6xl{min-height:44px!important;padding-top:.5rem!important;padding-bottom:.5rem!important}
}
@media print{#mtbar,#mtprog,#mttoc,#mttop,#mtsheet{display:none!important}}
</style>
</head>
<body>
<!--mt-chrome-->

tance":"作者 Ado Kukic 是 Anthropic 的 DevRel（开发者关系），个人博客 adocomplete.com 发布。这是「厂商内部人做产品布道」的位置：技术描述基本可信（他有一手信息、且面向已在用的老用户不好糊弄），但天然偏正向——通篇零批评、零已知 bug、零「什么时候别用某功能」，语气是营销式激励（「Know your limits. Then exceed them.」「Orange is the new green.」）。价值在「功能全景 + 版本更新点」，不在「取舍与坑」。文末引流到作者 Twitter 与 GitHub issue，个人品牌属性明确。","practical_takeaways":["大项目别把所有规则塞进一个 CLAUDE.md：用 .claude/rules/ 拆模块，YAML `paths: src/api/**/*.ts` 让 API 规则只在改 API 时加载，省上下文","把「! 前缀跑 bash」变成肌肉记忆——查状态/跑测试不必让模型代劳，输出直接进上下文且不烧 token","上下文吃紧时先跑 `/context` 定位大头（系统 prompt / MCP / CLAUDE.md / skills / 历史各占多少），再决定砍哪块","把高频 prompt 存成 markdown 变 slash command，支持 $ARGUMENTS 传参（如 /explain src/auth.ts）","用 Hooks 做确定性护栏：PreToolUse 拦危险命令、PermissionRequest 自动放行白名单、Stop 类事件发通知——用确定性规则兜住概率性 AI","Sandbox 用 `mcp__server__*` 通配一次性放行整个 MCP server，避免逐条点 Allow","跨设备工作流：claude.ai/code 起会话跑着，回终端 `claude --teleport <id>` 接着干；反查历史用 Ctrl+R 不重打","MAX_THINKING_TOKENS 一旦设置就会覆盖 ultrathink 关键词——想让 ultrathink 生效就别设这个环境变量"]},"_unfamiliar_mode":null,"_familiar_mode":{"increments":[{"fact":"`#` 开头追加 CLAUDE.md 的老用法在 Claude Code 2.0.70 起已废弃，改成直接口头让 Claude「update CLAUDE.md」","why_new":"改变了老用户的肌肉记忆，不看更新会踩空","page":"Memory Updates"},{"fact":"think / think harder / ultrathink 三档思考预算已合并为单一预算，只留 ultrathink 关键词，且被 MAX_THINKING_TOKENS 覆盖","why_new":"旧教程里的多档 thinking 写法已过时","page":"Ultrathink"},{"fact":"Sandbox 支持 `mcp__server__*` 通配语法一次放行整个 MCP server","why_new":"此前需逐条授权，通配是新的省事写法","page":"Sandbox Mode"},{"fact":"Skills 已成为跨工具的开放标准（agentskills.io），不再只属于 Claude Code","why_new":"从产品功能升级为生态标准，可迁移到其他支持工具","page":"Agent Skills"},{"fact":"`--teleport <id>` 可把 claude.ai/code 的云端会话拉回本地终端续跑，移动/桌面 App 亦支持","why_new":"云端↔本地会话迁移是新的连续性能力","page":"Claude Code Remote"},{"fact":"Plan mode 拒绝方案时现在可以给反馈再迭代，而非只能重来","why_new":"迭代闭环变紧，改变 Plan mode 的用法","page":"Plan Mode"},{"fact":"LSP 集成给 Claude IDE 级代码智能：每次编辑后即时诊断、跳转定义/找引用、类型信息","why_new":"从「读文本」升级到「理解符号」，是较新的能力层","page":"LSP Integration"}],"new_takes":[{"take":"衡量一个人用 Claude Code 的水平，看他掌握多少「控制类」功能，而不是看他多敢让 AI 全自动","vs_mainstream":"与「AI coding 就是让它一把全做完」的直觉相反——作者把「保留控制权」抬成核心竞争力"}],"insights":[{"insight":"这份清单的编排顺序本身是一条学习曲线：上手→快捷键→会话→思考→权限→自动化→Agent，越往后越是「把人从执行者变成编排者」","implications":"如果只学前半（快捷键/会话），拿到的是效率工具；学到后半（hooks/subagents/SDK），拿到的是可编排平台——ROI 差一个量级"},{"insight":"全篇零负面信息（无 bug、无「何时别用」、无取舍代价），说明它是布道材料不是评测材料","implications":"可当「功能索引 + 更新日志」用，但决定要不要在生产里依赖某功能时，得另找一手踩坑经验或官方文档补齐边界"}],"tensions":[{"point":"YOLO 模式（--dangerously-skip-permissions）与全篇「保留控制权」的主张","your_prior":"既然核心哲学是给人控制权，就不该推「说 yes to everything」的模式","doc_view":"作者把它定位成隔离环境/可信操作下的合理选项，用 danger 命名自我警示——控制权也包括「主动选择放弃控制」的自由"},{"point":"「31 天」的深度承诺 vs 单条实际深度","your_prior":"advent 日历逐日展开，应该每条都讲透","doc_view":"汇总页把 31 天压成清单，每条停在「知道有这功能 + 一两个更新点」，深度靠读者自行延伸"}],"open_questions":["每个功能的「什么时候不该用 / 代价是什么」全篇缺席——例如 subagent 并行的 token 成本、YOLO 的实际事故面、hooks 写错时的调试成本","多数「latest version 支持 X」没给具体版本号，随时间会失准；技术内容半衰期短，几个月后需回官方文档核对","功能之间怎么组合成真实工作流（如 Plan mode + hooks + subagents 协同）没有端到端示例，停在单点介绍"]},"critical_lens":{"strengths":["功能覆盖面全且新：把 30+ 个散落功能收进 9 大主题，并标出多处版本更新点（# 语法废弃、思考预算合并、Sandbox 通配、Skills 成开放标准），对已用老用户查漏补缺价值高","结尾把散点统一到一条清晰的人机协作哲学，全文不只是清单还有立论","作者是 Anthropic DevRel，功能描述有一手信息背书，技术准确度可信度较高"],"weaknesses":["通篇零批评零取舍：没有任何功能的「何时别用 / 成本 / 已知坑」，是布道口吻而非评测——采用其结论前需自行补齐边界","每条深度浅，多停在「知道有这功能」；把 31 天承诺压成汇总清单，深度靠读者自行延伸","大量「latest version 支持 X」不带版本号，技术内容半衰期短，几个月后易失准","缺少功能组合的端到端工作流示例（Plan mode + hooks + subagents 怎么协同）"],"what_to_verify":[{"item":"各功能的具体触发方式/参数是否为你的版本现状（如 # 语法废弃版本、ultrathink 与 MAX_THINKING_TOKENS 关系）","how":"以官方文档 docs.claude.com 和本机 `claude --version` + `/help` 实测为准，不要以本文发布时状态为准"},{"item":"subagent 并行、YOLO 模式在生产环境的实际成本与风险","how":"小范围试点观测 token 消耗与权限事故面，别直接照搬到关键仓库"},{"item":"Skills「开放标准」的跨工具兼容程度","how":"查 agentskills.io 规范与目标工具的实际支持清单，验证可迁移性"}]},"reading_map":[{"section":"Getting Started（/init、rules、@ mentions）","pages":"第 1 段","summary":"三层上下文：自动 CLAUDE.md + 条件规则 + 即时注入","verdict":"deep","why":"项目上手的事实底座，回报最高"},{"section":"Essential Shortcuts（! / Esc Esc / Ctrl+R / Ctrl+S / 建议）","pages":"第 1 段","summary":"高频快捷键，效率大头","verdict":"deep","why":"日用五十遍，肌肉记忆价值高"},{"section":"Session Management（continue/resume/rename/teleport/export）","pages":"第 1-2 段","summary":"会话作为一等公民可命名可迁移","verdict":"deep","why":"连续性 + 云端本地迁移是新能力"},{"section":"Productivity Features（vim/statusline/context/stats/usage）","pages":"第 2 段","summary":"vim 编辑、状态栏、token 透视、用量面板","verdict":"skim","why":"/context 值得记，其余偏个人偏好"},{"section":"Thinking & Planning（ultrathink / Plan mode / API thinking）","pages":"第 2 段","summary":"显式控制思考预算与只读规划","verdict":"deep","why":"含关键更新点（三档合并）+ 核心哲学落点"},{"section":"Permissions & Safety（Sandbox / YOLO / Hooks）","pages":"第 2-3 段","summary":"定边界 + 确定性拦截 + 跳过确认","verdict":"deep","why":"Hooks 是把概率 AI 套上确定性护栏的关键"},{"section":"Automation & CI/CD（headless -p / commands）","pages":"第 3 段","summary":"进管道进 CI + prompt 复用为命令","verdict":"skim","why":"自动化入口，概念简单一看即会"},{"section":"Browser Integration（Claude Code + Chrome）","pages":"第 3 段","summary":"直接操作 Chrome 修 bug 并自验","verdict":"skim","why":"单一功能点，需装扩展"},{"section":"Advanced: Agents & Extensibility（subagents/skills/plugins/LSP/SDK）","pages":"第 3 段","summary":"从并行子代理到 SDK 的扩展阶梯","verdict":"deep","why":"把工具抬成可编排平台，ROI 最高的后半段"},{"section":"Quick Reference + Closing Thoughts","pages":"第 3 段","summary":"快捷键/命令/flag 速查表 + 收束的哲学","verdict":"skim","why":"速查表留档用；结尾一段点明主线值得一读"}],"quotes":[{"text":"AI is a lever. These features help you find the right grip.","page":"Closing Thoughts","note":"全篇主旨的一句话浓缩：AI 是杠杆，控制类功能帮你找到正确的握点"},{"text":"The developers who get the most out of Claude Code aren't the ones who type 「do everything for me.」 They're the ones who've learned when to use Plan mode, how to structure their prompts, when to invoke ultrathink, and how to set up hooks that catch mistakes before they happen.","page":"Closing Thoughts","note":"作者对「什么是会用 Claude Code」的定义——反直觉地强调控制而非放手"},{"text":"It's deterministic control over probabilistic AI.","page":"Hooks","note":"一句话点透 Hooks 的定位：用确定性规则兜住概率性 AI"},{"text":"This seems small until you realize you're using it fifty times a day.","page":"The ! Prefix","note":"解释为何一个不起眼的快捷键值得进肌肉记忆"}],"references":{"glossary":[{"term":"CLAUDE.md","definition":"项目级记忆文件，Claude 每次读取的常识底座；/init 可自动生成"},{"term":".claude/rules/","definition":"模块化规则目录，每个 .md 自动加载，可用 YAML paths 按文件路径条件生效"},{"term":"Plan mode","definition":"Shift+Tab×2 进入，只读不改直到用户批准方案的规划模式"},{"term":"Hooks","definition":"在工具/权限/通知/子代理等生命周期事件上运行的 shell 命令，做确定性拦截"},{"term":"Subagent","definition":"各带 200k 上下文、可并行/后台、能用全部 MCP 工具的子代理"},{"term":"headless mode (-p)","definition":"非交互运行、直接输出到 stdout 的 CLI 模式，用于脚本与 CI"},{"term":"teleport","definition":"把 claude.ai/code 上起的云端会话拉回本地终端续跑的机制"}],"further_reading":[{"type":"code","name":"@anthropic-ai/claude-agent-sdk","note":"官方 Agent SDK，query() 约 10 行复用 Claude Code 的 agent loop"},{"type":"data","name":"agentskills.io","note":"Agent Skills 开放标准站点，验证跨工具兼容性入口"},{"type":"person","name":"Ado Kukic (@adocomplete)","note":"作者，Anthropic DevRel；文末引流到其 Twitter 与 Claude Code GitHub issue"},{"type":"company","name":"claude.ai/chrome","note":"Claude Code + Chrome 浏览器扩展安装入口"}]}}</script>

<script type="module">
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const root = document.getElementById('root');
  const tocEl = document.getElementById('toc');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sections = [];

  let sectionCounter = 0;
  const section = (id, label, inner, opts = {}) => {
    sectionCounter++;
    sections.push({ id, label });
    const subhead = opts.subhead ? `<div class="section-subhead">${esc(opts.subhead)}</div>` : '';
    return `<section id="${id}">
      <div class="section-heading">
        <span class="num">${String(sectionCounter).padStart(2, '0')}</span>
        <span>${esc(label)}</span>
      </div>
      ${subhead}${inner}
    </section>`;
  };

  const pageRef = (p) => p ? `<span class="page-ref">📍 ${esc(p)}</span>` : '';
  const signClass = (s) => {
    const t = String(s ?? '');
    if (/^[+↑]|增|涨/.test(t.trim())) return 'pos';
    if (/^[-−↓]|降|跌/.test(t.trim())) return 'neg';
    return '';
  };

  // ===== Hero =====
  const meta = data.meta || {};
  const DOC_TYPES = {
    paper:           { label: '学术论文',  color: '#2563eb' },
    tech_report:     { label: '技术报告',  color: '#0d9488' },
    broker_research: { label: '投行研报',  color: '#B45309' },
    earnings:        { label: '公司财报',  color: '#7c3aed' },
    deep_article:    { label: '深度长文',  color: '#db2777' },
  };
  const dt = DOC_TYPES[meta.doc_type] || { label: meta.doc_type || '文档', color: '#78716c' };
  const docBadge = `<span class="badge" style="background: color-mix(in srgb, ${dt.color} 14%, transparent); color: ${dt.color};">${esc(dt.label)}</span>`;
  const modeBadge = meta.mode === 'unfamiliar'
    ? '<span class="badge mode-badge">陌生领域 · 系统性学习</span>'
    : meta.mode === 'familiar'
    ? '<span class="badge mode-badge">熟悉领域 · 增量获取</span>' : '';
  const extBadge = meta.extraction_source
    ? `<span class="ui text-xs text-muted">📄 ${esc(meta.extraction_source)}${meta.extraction_confidence && meta.extraction_confidence !== 'high' ? ` · ⚠ ${esc(meta.extraction_confidence)} 置信度` : ''}</span>` : '';

  const metaBits = [
    meta.pages && `<span class="text-muted ui text-sm">📑 ${esc(meta.pages)} 页</span>`,
    meta.publish_date && `<span class="text-muted ui text-sm">📅 ${esc(meta.publish_date)}</span>`,
    meta.institution && `<span class="text-muted ui text-sm">🏛 ${esc(meta.institution)}</span>`,
    meta.domain && `<span class="text-muted ui text-sm">🏷 ${esc(meta.domain)}</span>`,
    meta.language && `<span class="text-muted ui text-sm">🌐 ${esc(meta.language).toUpperCase()}</span>`,
  ].filter(Boolean).join(' · ');

  const authors = Array.isArray(meta.authors) && meta.authors.length
    ? `<div class="ui text-sm text-muted mt-3">✍️ ${meta.authors.slice(0, 8).map(esc).join(' · ')}${meta.authors.length > 8 ? ` 等 ${meta.authors.length} 人` : ''}</div>` : '';

  const sourceLink = meta.source_url
    ? `<a href="${esc(meta.source_url)}" target="_blank" class="ui text-sm accent hover:underline">原文链接 →</a>`
    : meta.source ? `<span class="ui text-xs text-muted mono">${esc(meta.source)}</span>` : '';

  const heroHTML = `
    <header class="space-y-4 pb-8" style="border-bottom: 1px solid var(--border);">
      <div class="flex items-center gap-3 flex-wrap">${docBadge}${modeBadge}${extBadge}</div>
      <h1 class="hero-title text-3xl md:text-4xl">${esc(meta.title || 'Document Report')}</h1>
      <div class="flex flex-wrap gap-x-1 gap-y-1 items-center">${metaBits}</div>
      ${authors}
      <div class="pt-2">${sourceLink}</div>
    </header>`;

  // ===== TLDR + worth_reading =====
  let tldrHTML = '';
  if (data.tldr) {
    const wr = data.worth_reading || {};
    const WORTH = { 'must-read': ['#15803d', '值得精读'], 'worth-skim': ['#ca8a04', '值得略读'], 'reference-only': ['#78716c', '存档备查'] };
    const w = WORTH[wr.score];
    const worthRow = wr.score ? `
      <div class="worth-row">
        <span class="badge" style="background: color-mix(in srgb, ${w[0]} 14%, transparent); color: ${w[0]};">${w[1]}</span>
        ${wr.one_liner ? `<span>${esc(wr.one_liner)}</span>` : ''}
        ${wr.who_should_read ? `<span class="text-muted">· 适合精读原文的人：${esc(wr.who_should_read)}</span>` : ''}
      </div>` : '<div class="worth-row" style="padding:0 0 16px;"></div>';
    tldrHTML = section('tldr', '一句话总结',
      `<div class="tldr-block">${esc(data.tldr)}</div>${worthRow}`);
  }

  // ===== Narrative (导读故事) =====
  let narrativeHTML = '';
  if (data.narrative) {
    const paras = String(data.narrative).split(/\n\n+/).map(p => `<p>${esc(p.trim())}</p>`).join('');
    narrativeHTML = section('narrative', '导读故事',
      `<div class="narrative-block">${paras}</div>`,
      { subhead: '把整份文档讲成一个连续的故事 · 一个例子贯穿到底 · 读完应能向别人复述。' });
  }

  // ===== Key numbers =====
  let knHTML = '';
  if (Array.isArray(data.key_numbers) && data.key_numbers.length) {
    const knSize = (v) => { const n = String(v ?? '').length; return n > 24 ? 'kn-sm' : n > 14 ? 'kn-md' : ''; };
    knHTML = section('key-numbers', '关键数字',
      `<div class="kn-grid">
        ${data.key_numbers.map(k => `
          <div class="kn-card">
            <div class="kn-metric">${esc(k.metric)}</div>
            <div class="kn-value ${signClass(k.value)} ${knSize(k.value)}">${esc(k.value)}</div>
            ${k.context ? `<div class="kn-context">${esc(k.context)}</div>` : ''}
            ${k.page ? `<div class="kn-page">📍 ${esc(k.page)}</div>` : ''}
          </div>`).join('')}
      </div>`,
      { subhead: '原文里最重要的数字 · 每个都标了出处页码，可回原文核对。' });
  }

  // ===== Core questions =====
  let questionsHTML = '';
  if (Array.isArray(data.core_questions) && data.core_questions.length) {
    questionsHTML = section('questions', '核心问题',
      data.core_questions.map((q, i) => `
        <div class="question-card">
          <span class="question-num">问题 ${String(i+1).padStart(2,'0')}</span>
          <div class="question-text">${esc(q.question)}</div>
          ${q.approach ? `<div class="question-approach"><span class="label-pill">论证路径</span>${esc(q.approach)}</div>` : ''}
          ${q.answer ? `<div class="question-answer"><span class="label-pill">文档的答案</span>${esc(q.answer)}</div>` : ''}
        </div>`).join(''),
      { subhead: '不是结论清单，是这份文档真正在回答的问题。读完每条你应该能复述论证。' });
  }

  // ===== Type blocks =====
  let typeHTML = '';

  // ---- paper ----
  const tp = data._type_paper;
  if (tp) {
    let bits = '';
    if (tp.problem || tp.prior_gap) {
      bits += `<div class="space-y-0">
        ${tp.problem ? `<div class="premise"><div class="premise-point">要解决的问题</div><div class="premise-explanation">${esc(tp.problem)}</div></div>` : ''}
        ${tp.prior_gap ? `<div class="premise"><div class="premise-point">之前的方法卡在哪</div><div class="premise-explanation">${esc(tp.prior_gap)}</div></div>` : ''}
      </div>`;
    }
    if (tp.method) {
      const m = tp.method;
      bits += `<div class="mental-block" style="margin-top:24px;">
        <div class="mental-name">方法：${esc(m.name || '')}</div>
        ${m.key_idea ? `<div class="application-callout" style="margin-bottom:16px;"><div class="label">核心 idea（一句话）</div><div>${esc(m.key_idea)}</div></div>` : ''}
        ${m.description ? `<div class="mental-description">${esc(m.description)}</div>` : ''}
        ${m.mermaid ? `<div class="mermaid-frame"><div class="mermaid">${esc(m.mermaid)}</div></div><div class="mermaid-caption">图：${esc(m.name || '方法结构')}</div>` : ''}
      </div>`;
    }
    if (Array.isArray(tp.results) && tp.results.length) {
      bits += `<div style="margin-top:8px;">
        <div class="ui text-xs uppercase tracking-wider text-muted mb-4" style="letter-spacing:0.08em;">主要结果 · 声称 vs 证据</div>
        ${tp.results.map(rr => `
          <div class="evidence-card">
            <div class="evidence-claim">${esc(rr.claim)}
              ${rr.strength ? `<span class="strength-badge strength-${esc(rr.strength)}">${({strong:'证据强',moderate:'证据中',weak:'证据弱'})[rr.strength] || esc(rr.strength)}</span>` : ''}
              ${pageRef(rr.page)}
            </div>
            ${rr.evidence ? `<div class="evidence-detail">${esc(rr.evidence)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    }
    if (Array.isArray(tp.limitations) && tp.limitations.length) {
      bits += `<div class="warn-box"><div class="label">局限性</div><ul>
        ${tp.limitations.map(l => `<li>${esc(l.point)} <span class="ui text-xs" style="color:var(--muted);">[${l.source === 'analyst' ? '分析者补充' : '作者承认'}]</span></li>`).join('')}
      </ul></div>`;
    }
    if (tp.reproducibility) {

    }
    if ((cl.what_to_verify||[]).length) {
      bits += `<div class="ui text-xs uppercase tracking-wider text-muted mb-2" style="letter-spacing:0.08em; margin-top:28px;">采用结论前，先验证这些</div>
        <div>${cl.what_to_verify.map(v => `
          <div class="quickstart-item"><span class="check">🔍</span>
            <span><b>${esc(v.item)}</b>${v.how ? `<br><span class="ui text-sm" style="color:var(--muted);">怎么验：${esc(v.how)}</span>` : ''}</span>
          </div>`).join('')}</div>`;
    }
    lensHTML = section('critical-lens', '批判性阅读', bits,
      { subhead: '这份文档哪里扎实、哪里薄弱、用它的结论前该验证什么 — 分析者视角，不是文档的话。' });
  }

  // ===== The one insight (带走一句) =====
  let insightHTML = '';
  if (data.the_one_insight) {
    insightHTML = section('one-insight', '带走一句',
      `<div class="insight-hero">
        <div class="ilabel">如果整份报告只记一句话</div>
        <div class="itext">${esc(data.the_one_insight)}</div>
      </div>`,
      { subhead: '蒸馏，不是压缩 — 离开这份文档它也该单独成立。' });
  }

  // ===== Quotes =====
  let quotesHTML = '';
  if (Array.isArray(data.quotes) && data.quotes.length) {
    quotesHTML = section('quotes', '原文金句',
      data.quotes.slice(0, 5).map(q => `
        <div class="pullquote">
          <div class="pullquote-text">${esc(q.text)}</div>
          <div class="pullquote-attribution ui">${q.page ? `📍 <span class="mono">${esc(q.page)}</span>` : ''}</div>
          ${q.note ? `<div class="pullquote-note">${esc(q.note)}</div>` : ''}
        </div>`).join(''),
      { subhead: '原文照抄 · 选「脱离上下文也成立」的句子。' });
  }

  // ===== References =====
  let referencesHTML = '';
  const refs = data.references || {};
  const glossary = refs.glossary || [];
  const furtherReading = refs.further_reading || [];
  if (glossary.length || furtherReading.length) {
    let inner = '';
    if (glossary.length) {
      inner += `<div class="mb-8">
        <div class="ui text-xs uppercase tracking-wider text-muted mb-3" style="letter-spacing: 0.08em;">术语表</div>
        <div>${glossary.map(g => `
          <div class="glossary-row">
            <div class="glossary-term">${esc(g.term)}</div>
            <div class="glossary-definition">${esc(g.definition)}</div>
          </div>`).join('')}</div>
      </div>`;
    }
    if (furtherReading.length) {
      inner += `<div>
        <div class="ui text-xs uppercase tracking-wider text-muted mb-3" style="letter-spacing: 0.08em;">延伸阅读</div>
        <div>${furtherReading.map(r => `
          <div class="reading-item">
            <span class="reading-type">${esc(r.type)}</span>
            <div><div class="reading-name">${esc(r.name)}</div>
            ${r.note ? `<div class="reading-note">${esc(r.note)}</div>` : ''}</div>
          </div>`).join('')}</div>
      </div>`;
    }
    referencesHTML = section('references', '参考资料', inner, { subhead: '术语表 + 延伸阅读 · 末尾参考用。' });
  }

  root.innerHTML = heroHTML + tldrHTML + narrativeHTML + knHTML + questionsHTML + typeHTML + rmapHTML
    + unfamiliarHTML + familiarHTML + lensHTML + insightHTML + quotesHTML + referencesHTML;

  tocEl.innerHTML = sections.map((s, i) => `
    <a href="#${s.id}" class="toc-link">
      <span class="mono text-muted" style="font-size: 11px;">${String(i+1).padStart(2,'0')}</span>
      &nbsp;${esc(s.label)}
    </a>`).join('');

  renderFlowcharts(root);

  const links = Array.from(tocEl.querySelectorAll('a'));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('section[id]').forEach(s => observer.observe(s));

  // ====== 流程图渲染器:flowchart 源码 → 卡片 + SVG 箭头(替代 mermaid) ======
  function renderFlowcharts(scope) {
    (scope || document).querySelectorAll('.mermaid').forEach(function (host) {
      if (host.dataset.fcDone) return;
      const src = host.textContent || '';
      const head = src.trim().split('\n')[0].trim();
      if (!/^(flowchart|graph)\s+/i.test(head)) return; // 只处理流程图,其它原样留着
      const g = fcParse(src);
      if (!g || g.order.length === 0) return;
      host.dataset.fcDone = '1';
      fcDraw(host, g);
    });
  }

  function fcParse(src) {
    const lines = src.trim().split('\n');
    let dir = 'TD';
    const nodes = {}, order = [], edges = [];
    function tok(t) {
      t = t.trim();
      const m = t.match(/^([A-Za-z0-9_]+)\s*(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?$/);
      if (!m) return null;
      const id = m[1];
      const label = (m[2] != null ? m[2] : m[3] != null ? m[3] : m[4]);
      const shape = m[3] != null ? 'decision' : 'rect';
      if (!nodes[id]) { nodes[id] = { id: id, label: label || id, shape: shape }; order.push(id); }
      else if (label) { nodes[id].label = label; if (shape === 'decision') nodes[id].shape = 'decision'; }
      return id;
    }
    lines.forEach(function (raw) {
      const line = raw.trim();
      if (!line) return;
      const fm = line.match(/^(?:flowchart|graph)\s+(TD|TB|LR|RL)/i);
      if (fm) { dir = fm[1].toUpperCase(); return; }
      const em = line.match(/^(.+?)\s*--+>\s*(?:\|([^|]*)\|\s*)?(.+)$/);
      if (em) { const a = tok(em[1]); const b = tok(em[3]); if (a && b) edges.push({ a: a, b: b, lbl: (em[2] || '').trim() }); }
      else { tok(line); }
    });
    return { dir: dir === 'TB' ? 'TD' : dir, nodes: nodes, order: order, edges: edges };
  }

  function fcLayers(g) {
    const L = {}; g.order.forEach(function (id) { L[id] = 0; });
    let changed = true, guard = 0;
    while (changed && guard++ < 300) {
      changed = false;
      g.edges.forEach(function (e) { if (L[e.b] < L[e.a] + 1) { L[e.b] = L[e.a] + 1; changed = true; } });
    }
    const layers = [];
    g.order.forEach(function (id) { (layers[L[id]] = layers[L[id]] || []).push(id); });
    return layers;
  }

  function fcDraw(host, g) {
    const lr = (g.dir === 'LR' || g.dir === 'RL');
    const layers = fcLayers(g);
    host.textContent = '';
    host.style.position = 'relative';
    host.style.width = '100%';
    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible';
    const mid = 'fcah' + Math.random().toString(36).slice(2);
    const defs = document.createElementNS(SVGNS, 'defs');
    defs.innerHTML = '<marker id="' + mid + '" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="context-stroke"/></marker>';
    svg.appendChild(defs);
    host.appendChild(svg);

    const flow = document.createElement('div');
    flow.style.cssText = 'position:relative;z-index:1;display:flex;gap:' + (lr ? '48px' : '32px') + ';' +
      (lr ? 'flex-direction:row;align-items:center' : 'flex-direction:column;align-items:stretch');
    const el = {};
    layers.forEach(function (layer) {
      const band = document.createElement('div');
      band.style.cssText = 'display:flex;gap:18px;justify-content:center;flex-wrap:wrap;' + (lr ? 'flex-direction:column' : 'flex-direction:row');
      (layer || []).forEach(function (id) {
        const n = g.nodes[id];
        const dec = n.shape === 'decision';
        const card = document.createElement('div');
        card.style.cssText = 'box-sizing:border-box;width:' + (lr ? '160px' : '200px') + ';padding:11px 14px;border-radius:' +
          (dec ? '13px' : '10px') + ';font-size:13.5px;line-height:1.5;background:' + (dec ? 'var(--accent-bg)' : 'var(--bg-card)') +
          ';color:var(--fg);border:1px solid ' + (dec ? 'var(--accent)' : 'var(--border)') + ';' +
          (dec ? '' : 'border-left:3px solid var(--accent);') +
          'box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 18px -12px rgba(0,0,0,.22);text-align:' + (dec ? 'center' : 'left') + ';white-space:normal';
        card.innerHTML = (dec ? '<div style="font:600 10px var(--sans);letter-spacing:.1em;color:var(--accent);opacity:.85;margin-bottom:3px">判断</div>' : '') +
          fcEsc(n.label).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
        band.appendChild(card);
        el[id] = card;
      });
      flow.appendChild(band);
    });
    host.appendChild(flow);

    function draw() {
      const hb = host.getBoundingClientRect();
      if (!hb.width) return;
      svg.setAttribute('viewBox', '0 0 ' + hb.width + ' ' + hb.height);
      Array.prototype.forEach.call(svg.querySelectorAll('.fce'), function (n) { n.remove(); });
      g.edges.forEach(function (e) {
        const A = el[e.a], B = el[e.b]; if (!A || !B) return;
        const a = A.getBoundingClientRect(), b = B.getBoundingClientRect();
        let x1, y1, x2, y2, d;
        if (lr) { x1 = a.right - hb.left; y1 = a.top + a.height / 2 - hb.top; x2 = b.left - hb.left; y2 = b.top + b.height / 2 - hb.top; const mx = (x1 + x2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + (x2 - 2) + ',' + y2; }
        else { x1 = a.left + a.width / 2 - hb.left; y1 = a.bottom - hb.top; x2 = b.left + b.width / 2 - hb.left; y2 = b.top - hb.top; const my = (y1 + y2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + (y2 - 2); }
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('class', 'fce'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
        p.style.stroke = 'var(--muted-soft)'; p.setAttribute('stroke-width', '1.7'); p.setAttribute('marker-end', 'url(#' + mid + ')');
        svg.appendChild(p);
        if (e.lbl) {
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, tw = e.lbl.length * 13 + 14;
          const r = document.createElementNS(SVGNS, 'rect');
          r.setAttribute('class', 'fce'); r.setAttribute('x', mx - tw / 2); r.setAttribute('y', my - 11); r.setAttribute('width', tw); r.setAttribute('height', 21); r.setAttribute('rx', 10);
          r.style.fill = 'var(--bg)'; r.style.stroke = 'var(--border)';
          const t = document.createElementNS(SVGNS, 'text');
          t.setAttribute('class', 'fce'); t.setAttribute('x', mx); t.setAttribute('y', my + 4); t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12.5');
          t.style.fill = 'var(--muted)'; t.setAttribute('font-family', 'var(--sans)'); t.textContent = e.lbl;
          svg.appendChild(r); svg.appendChild(t);
        }
      });
    }
    requestAnimationFrame(function () { requestAnimationFrame(draw); });
    if (window.ResizeObserver) { new ResizeObserver(function () { requestAnimationFrame(draw); }).observe(host); }
    window.addEventListener('resize', draw);
  }

  function fcEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
</script>

<script>
(function(){
var p=document.getElementById('mtprog'),tb=document.getElementById('mttoc'),
    tp=document.getElementById('mttop'),sh=document.getElementById('mtsheet'),
    ln=document.getElementById('mtlinks');
function onScroll(){
  var d=document.documentElement,m=d.scrollHeight-window.innerHeight,y=window.scrollY;
  p.style.width=(m>0?Math.min(100,y/m*100):0)+'%';
  tp.classList.toggle('show',y>600);
  document.documentElement.classList.toggle('mt-scrolled',y>80);
}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
tp.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
function fill(){
  ln.innerHTML='';var seen={};
  var as=document.querySelectorAll('#toc a[href^="#"], nav a[href^="#"]');
  for(var i=0;i<as.length;i++){
    var a=as[i],h=a.getAttribute('href');
    if(!h||h==='#'||h==='#top'||seen[h])continue;
    if(!document.getElementById(h.slice(1)))continue;
    seen[h]=1;
    var b=document.createElement('a');b.href=h;
    b.textContent=a.textContent.replace(/\s+/g,' ').trim();
    b.addEventListener('click',function(){sh.hidden=true});
    ln.appendChild(b);
  }
  if(!ln.children.length){
    var b2=document.createElement('a');b2.href='#top';b2.textContent='回到顶部';
    b2.addEventListener('click',function(){sh.hidden=true});ln.appendChild(b2);
  }
}
tb.addEventListener('click',function(){fill();sh.hidden=false});
sh.addEventListener('click',function(e){if(e.target===sh)sh.hidden=true});
document.getElementById('mtclose').addEventListener('click',function(){sh.hidden=true});
function polish(){
  document.querySelectorAll('a').forEach(function(a){
    if(a.textContent.replace(/\s+/g,' ').trim()===('AI Podcast '+'Listener')){
      a.textContent='Valley Beacon 深读';
      a.setAttribute('aria-label','Valley Beacon 深读');
    }
  });
  var raw=document.getElementById('report-data');
  if(!raw) return;
  var data;
  try{data=JSON.parse(raw.textContent)}catch(e){return}
  var meta=data.meta||{};
  if(!meta.original_title||meta.original_title===meta.title) return;
  function insertOriginal(){
    if(document.querySelector('.mt-original-title')) return;
    var h=document.querySelector('.hero-title,h1');
    if(!h) return;
    var p=document.createElement('p');
    p.className='mt-original-title';
    p.textContent=meta.original_title;
    h.insertAdjacentElement('afterend',p);
  }
  insertOriginal();
  requestAnimationFrame(insertOriginal);
  setTimeout(insertOriginal,300);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',polish);
else polish();
})();
</script>
