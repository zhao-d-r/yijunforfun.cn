<!-- 自绘流程图渲染器(见 renderFlowcharts):读 .mermaid 里的 flowchart 源码,
     解析→分层布局→卡片+SVG 箭头。不再加载 mermaid CDN(更好看 + 去掉 loose XSS 面)。 -->
<style>
  /* ====== Claude-inspired design tokens ====== */
  :root {
    --bg: #fafaf7;
    --bg-card: #ffffff;
    --fg: #1c1917;
    --fg-secondary: #44403c;
    --muted: #78716c;
    --muted-soft: #a8a29e;
    --accent: #B45309;          /* amber-700, 暖石头色 */
    --accent-bg: #fef3c7;       /* amber-100 */
    --accent-bg-dark: #fbbf24;  /* amber-400 */
    --border: #e7e5e4;
    --border-soft: #f5f5f4;
    --serif: 'Charter', 'Iowan Old Style', 'PingFang SC', 'Noto Serif SC', Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  html.dark {
    --bg: #0c0a09;
    --bg-card: #1c1917;
    --fg: #f5f5f4;
    --fg-secondary: #d6d3d1;
    --muted: #a8a29e;
    --muted-soft: #78716c;
    --accent: #fbbf24;
    --accent-bg: #422006;
    --border: #292524;
    --border-soft: #1c1917;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.75;
    font-feature-settings: "kern", "liga", "calt";
  }
  .ui { font-family: var(--sans); }
  .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  .text-muted { color: var(--muted); }
  .text-secondary { color: var(--fg-secondary); }
  .accent { color: var(--accent); }
  .accent-bg { background: var(--accent-bg); }
  .border-accent { border-color: var(--accent); }

  /* ====== Components ====== */

  /* Hero */
  .hero-title {
    font-family: var(--serif);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  /* Mode badge */
  .mode-badge {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    display: inline-block;
  }

  /* Section heading */
  .section-heading {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 24px;
    margin-top: 56px;
    margin-bottom: 24px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .section-heading .num {
    color: var(--accent);
    font-weight: 700;
    margin-right: 4px;
  }
  .section-subhead {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--muted);
    margin-top: -16px;
    margin-bottom: 24px;
    font-style: italic;
  }

  /* TLDR block — large, editorial */
  .tldr-block {
    font-family: var(--serif);
    font-size: 24px;
    line-height: 1.5;
    font-weight: 400;
    padding: 24px 0;
    border-top: 2px solid var(--fg);
    border-bottom: 1px solid var(--border);
  }

  /* Core question card */
  .question-card {
    border-left: 3px solid var(--accent);
    padding: 20px 24px;
    margin-bottom: 32px;
    background: var(--bg-card);
    border-radius: 0 8px 8px 0;
  }
  .question-num {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }
  .question-text {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 16px;
    color: var(--fg);
  }
  .question-approach, .question-answer {
    font-size: 15px;
    line-height: 1.7;
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 12px;
  }
  .question-approach {
    background: var(--border-soft);
    color: var(--fg-secondary);
  }
  .question-answer {
    background: var(--accent-bg);
  }
  .label-pill {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }

  /* Timeline (chapters) — vertical line + dots */
  .timeline-list { position: relative; padding-left: 28px; }
  .timeline-list::before {
    content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding-bottom: 20px;
  }
  .timeline-item::before {
    content: ""; position: absolute; left: -28px; top: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--accent);
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .timeline-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    margin-top: 2px;
    color: var(--fg);
  }
  .timeline-summary {
    font-size: 14px;
    color: var(--fg-secondary);
    margin-top: 4px;
    line-height: 1.6;
  }

  /* Premise (basics) — subtle left border, no heavy card */
  .premise {
    border-left: 2px solid var(--border);
    padding: 4px 0 4px 20px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }
  .premise:hover { border-left-color: var(--accent); }
  .premise-point {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    line-height: 1.4;
    color: var(--fg);
    margin-bottom: 8px;
  }
  .premise-explanation {
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg-secondary);
  }

  /* Mental model block — Mermaid prominent + caption */
  .mental-block {
    margin-bottom: 56px;
  }
  .mental-name {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--fg);
    margin-bottom: 10px;
  }
  .mental-description {
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg-secondary);
    margin-bottom: 20px;
  }
  .mermaid-frame {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 20px;
    margin: 16px 0;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  .mermaid-frame .mermaid { max-width: 100%; }
  .mermaid-caption {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    font-style: italic;
  }
  .application-callout {
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 16px 20px;
    margin-top: 16px;
  }
  .application-callout .label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  /* Slides gallery — visual captures from video lectures */
  .slides-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  @media (max-width: 720px) { .slides-grid { grid-template-columns: 1fr; } }
  .slide-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 0;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .slide-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .slide-card img {
    width: 100%;
    height: auto;
    display: block;
    background: #000;
  }
  .slide-card figcaption {
    padding: 12px 16px 14px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    color: var(--fg-secondary);
  }
  .slide-card .slide-time {
    font-family: var(--mono, ui-monospace, monospace);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 6px;
  }
  .slide-card .slide-type-badge {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    margin-right: 6px;
    color: white;
    background: var(--muted);
  }
  .slide-card .slide-type-badge.title { background: #8a8a8a; }
  .slide-card .slide-type-badge.content { background: #5a7d9a; }
  .slide-card .slide-type-badge.code { background: #2d5a3d; }
  .slide-card .slide-type-badge.equation { background: #6a4c8c; }
  .slide-card .slide-type-badge.diagram { background: #b87333; }
  .slide-card .slide-type-badge.demo { background: #a84545; }
  .slide-card .slide-caption {
    color: var(--fg);
    font-weight: 500;
  }
  .slide-card .visual-text {
    margin: 10px 16px 14px;
    padding: 10px 12px;
    background: var(--border-soft, #f5f5f5);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-family: var(--mono, ui-monospace, monospace);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--fg-secondary);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .slide-card .visual-text-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 4px;
    display: block;
  }
  /* Visual evidence chain — small slide refs next to report sections */
  .visual-refs {
    margin-top: 12px;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
  }
  .visual-refs .label {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-right: 6px;
    color: var(--accent);
  }
  .visual-refs a {
    color: var(--accent);
    text-decoration: none;
    margin-right: 6px;
    border-bottom: 1px dotted var(--accent);
  }
  .visual-refs a:hover { border-bottom-style: solid; }

  /* Playbook — connected steps */
  .playbook-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 32px;
  }
  .playbook-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .playbook-when {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .step-list {
    counter-reset: step;
    position: relative;
    padding-left: 0;
  }
  .step-item {
    position: relative;
    padding-left: 48px;
    padding-bottom: 20px;
    counter-increment: step;
  }
  .step-item:not(:last-child)::after {
    content: ""; position: absolute; left: 17px; top: 36px; bottom: 0;
    width: 2px; background: var(--border);
  }
  .step-item::before {
    content: counter(step);
    position: absolute; left: 0; top: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent-bg);
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .step-detail {
    font-size: 14px;
    line-height: 1.7;
    color: var(--fg-secondary);
  }
  .pitfalls-box {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 8px;
    background: color-mix(in srgb, #f87171 12%, transparent);
    border-left: 3px solid #dc2626;
  }
  .pitfalls-box .label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #dc2626;
    margin-bottom: 8px;
  }
  .pitfalls-box ul {
    font-size: 14px;
    line-height: 1.6;
    padding-left: 18px;
    color: var(--fg-secondary);
  }
  .pitfalls-box li { margin-bottom: 4px; }

  /* Quick start — checklist style */
  .quickstart-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 15px;
    line-height: 1.6;
  }
  .quickstart-item:last-child { border-bottom: none; }
  .quickstart-item .check {
    color: var(--accent);
    font-size: 18px;
    line-height: 1.4;
    flex-shrink: 0;
  }

  /* Pull quote */
  .pullquote {
    margin: 32px 0;
    padding: 8px 0 8px 32px;
    border-left: 4px solid var(--accent);
    position: relative;
  }
  .pullquote::before {
    content: """;
    position: absolute;
    left: -8px;
    top: -20px;
    font-family: Georgia, serif;
    font-size: 72px;
    color: var(--accent);
    opacity: 0.3;
    line-height: 1;
  }
  .pullquote-text {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    line-height: 1.5;
    color: var(--fg);
  }
  .pullquote-attribution {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
  }

  /* References (footer-style) */
  .references-block { font-size: 14px; }
  .glossary-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .glossary-row:last-child { border-bottom: none; }
  .glossary-term {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .glossary-definition {
    color: var(--fg-secondary);
    line-height: 1.6;
  }
  .reading-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .reading-item:last-child { border-bottom: none; }
  .reading-type {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 8px;
    border-radius: 3px;
    flex-shrink: 0;
    min-width: 60px;
    text-align: center;
  }
  .reading-name { font-weight: 600; }
  .reading-note { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* TOC */
  .toc-link {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    transition: color 0.15s;
    padding: 4px 0;
    display: block;
  }
  .toc-link:hover, .toc-link.active {
    color: var(--accent);
  }
  .toc-link.active { font-weight: 600; }

  /* Print */
  @media print {
    .no-print { display: none !important; }
    body { font-size: 12pt; }
    .question-card, .playbook-block, .mermaid-frame { break-inside: avoid; }
  }

  section[id] { scroll-margin-top: 80px; }
</style>
<style>

<body>
<!--mt-chrome-->

<script id="report-data" type="application/json">{"meta":{"title":"为什么下一步是「视频 Agent」——对话 xAI Grok Imagine 的 Ethan He","podcast":"Latent Space","source_url":"https://www.latent.space/p/video-agents","source_type":"generic","duration":"1h43m","speakers":["swyx","Vibhu","Ethan He"],"publish_date":"2026-06-01","domain":"AI / 视频生成模型","mode":"unfamiliar","language":"en","transcript_source":"first-party","transcript_confidence":"medium","original_title":"Why Video Agent models are next — Ethan He, xAI Grok Imagine"},"tldr":"xAI 的 Ethan He 拆解视频生成模型如何炼成，并抛出核心判断：视频模型的智能主要来自语言模型，下一个 Sora 不会是更强的视频模型，而是会规划、生成、编辑、迭代的「视频 Agent」。","key_takeaways":["视频模型先靠图像模型打底再扩展到视频","训练数据是 100% 合成的「语言-画面」配对","VAE 把像素压成 latent token 才能训 transformer","推理提速主要靠 step distillation 把步数砍到个位数","视频训练的隐性大头是存储与数据传输成本","世界模型 = 实时 + 可交互 + 长时程的视频","视频模型的智能大多来自语言模型而非视频本身","下一阶段竞争在视频 Agent 的编排，而非单次生成"],"core_questions":[{"question":"为什么说视频模型的智能主要来自语言模型,而不是视频本身?","approach":"把「生成画质」与「理解意图」拆开,分别归因看近期能力跃升靠什么。","answer":"扩散模型负责把意图变成像素,但「理解你要什么」发生在 prompt rewriter 这一语言模型环节。近期视频能力的提升大多来自语言模型变聪明,而非扩散结构的新算法——所以下一个 Sora 的竞争点不在更强的生成器,而在编排。"},{"question":"视频模型是怎么训练出来的?数据从哪来?","approach":"沿「图像打底 → 合成配对 → 压进 latent」的流水线逐段拆。","answer":"先用图像模型打底再扩展到视频。训练数据是 100% 合成的「语言-画面」配对——互联网视频天然没有对齐的文字描述,靠人工冷启动加 VLM 自动标注造出来;最后用 VAE/tokenizer 把像素压成 latent token,transformer 才训得动。"},{"question":"一个小团队怎么在三个月内做出 Grok Imagine?","approach":"把速度归因到组织与工程,而不是算法创新。","answer":"强人才密度、低沟通成本和现成的强基建是前提;迭代次数决定训练速度,而大量质量提升其实来自修数据和训练流水线里的小 bug,不是新算法。"},{"question":"训练大视频模型,钱真正花在哪?","approach":"摊开账本,对比显性算力成本与隐性数据成本。","answer":"隐性大头是存储与传输:几十 PB 的视频与特征,ingress/egress 费用甚至比存储本身还贵,总成本可比一个中等规模 LLM。推理侧靠 step distillation 把去噪步数砍到个位数,再叠加 consistency model 与 GAN 进一步提速。"},{"question":"什么才算「世界模型」?现在卡在哪?","approach":"用三个硬指标下定义,再分别看瓶颈。","answer":"实时、可交互、长时程的视频,三者缺一不可。实时性被时间压缩的权衡卡住;长时程靠 video extension 与 reference 图缓解——视频侧的长上下文管理甚至走在 LLM 前面。"},{"question":"视频 Agent 会长什么样,为什么它是下一阶段?","approach":"类比 LLM Agent 的工具编排,推演视频生成的下一层抽象。","answer":"一个会规划、生成、编辑、迭代的编排系统:语言模型当大脑,调用生成与剪辑等确定性工具产出长视频。能力不必全塞进单一模型——「Diffusion front-end, deterministic back-end」,前端扩散出画面,后端是确定性逻辑。"},{"question":"机器人和物理 AI 一定要在真实世界里训练吗?","approach":"把具身智能拆成感知决策与执行,看哪部分可被视频模型替代。","answer":"Ethan 判断未必:视频能力足够强的 LLM 可以把机器人当工具调用,物理 AI 的大部分训练可以在生成的世界里完成,不必都发生在现实环境。"}],"_unfamiliar_mode":{"basics":[{"point":"视频模型是建立在图像模型之上的","explanation":"图像模型更便宜、语言与画面的对应更稠密，所以业内通行做法是先训好图像扩散模型，再用它来 bootstrap 视频模型。直接从零训视频成本高且语言理解不足，这是从业者的默认起点。"},{"point":"训练用的「文字-画面」配对几乎全是合成的","explanation":"互联网上视频的标题、描述、评论大多和画面无关（画的是山，标题却是「今天好开心」）。所以必须用 VLM 给视频/图像生成详细描述作为配对文本。这是整个领域绕不开的数据前提。"},{"point":"生成式模型在 latent 空间而非像素上训练","explanation":"一张 1000×1000 的图就是约一百万像素，直接当 token 训 transformer 不现实。所以要先训一个 tokenizer / VAE 把图像压进连续的 latent 空间，再在 latent 上做生成，最后还原回像素。"},{"point":"主流生成范式是扩散 transformer 加去噪","explanation":"训练流程其实和语言 transformer 很像，只是输入输出换成视觉 token，并多了去噪过程：往 token 加随机噪声、让模型学会去掉噪声还原干净 token。推理时模型从纯噪声反复去噪生成结果。"},{"point":"时间压缩率越高越省算力，但越不实时","explanation":"相邻帧高度相似，所以压缩时间维度（如 4 帧压成 1 个 token）能大幅省 context 长度。代价是无法逐帧即时响应用户操作，天然带来延迟。实时交互与高压缩率之间存在硬性权衡。"},{"point":"视频模型的训练成本与大语言模型相当","explanation":"开源视频模型已达 19B 参数（如 LTX）量级，token 数也到数十万亿，加上存储与 I/O 开销，整体成本可比中等规模 LLM。视频不是「便宜的小模型」，这是从业者的共识。"}],"frameworks":[{"name":"图像→视频生成的训练流水线","description":"理解一个视频生成模型怎么从零炼成的标准路径：采集数据、合成配对、训 VAE、训扩散 transformer、再做推理蒸馏。","mermaid":"flowchart TD\n  A[从互联网采集图像/视频] --> B[用 VLM 生成详细描述\\n合成「文字-画面」配对]\n  B --> C[训练 VAE/tokenizer\\n像素压成 latent token]\n  C --> D[训练图像扩散 transformer\\n语言-画面稠密对齐]\n  D --> E[bootstrap 视频模型\\n复用图像模型基础]\n  E --> F[step distillation 蒸馏\\n推理步数砍到个位数]","how_to_apply":"判断任何一家视频生成产品时，可逐环节追问：数据怎么标？用的哪种 VAE 压缩？是否从图像模型 bootstrap？推理蒸馏到几步？能快速定位它强在哪、卡在哪。"},{"name":"世界模型三要素","description":"Ethan 对世界模型的定义：实时 + 可交互 + 长时程的视频。三者缺一不可，也分别对应不同的技术瓶颈。","mermaid":"flowchart TD\n  W((世界模型)) --> A[可交互\\n键盘/鼠标/语音输入\\n模型合理响应]\n  W --> B[实时\\n响应延迟够低\\n游戏需毫秒级]\n  W --> C[长时程\\n能生成几分钟到几小时\\n而非几秒]\n  B --> D[与时间压缩冲突\\n压缩越高越laggy]\n  C --> E[长 context 爆炸\\n需选择性记忆]","how_to_apply":"评估一个「世界模型」demo 是不是噱头：分别打分它的实时性（延迟多少毫秒）、可交互性（能否响应输入）、长时程（能跑多久）。只满足一两项的，往往只是更好的视频模型。"},{"name":"视频 Agent：从单次生成到编排迭代","description":"类比 AI 编程从一次性补全演进到 Codex/Claude Code 的自动化，视频生成的下一步是语言模型把生成模型当工具来规划、生成、编辑、迭代。","mermaid":"flowchart LR\n  A[用户意图] --> B[语言模型/Agent\\n规划与 prompt 改写]\n  B --> C{调用工具}\n  C --> D[视频生成模型\\n生成片段]\n  C --> E[确定性工具\\nFFmpeg/编辑器]\n  D --> F[评估与迭代]\n  E --> F\n  F --> B\n  F --> G[产品级长视频]","how_to_apply":"做视频类产品时，不必死磕训一个更强的视频模型。可以拿现成的前沿推理模型搭 harness，把视频生成、编辑、FFmpeg 都当工具挂上去，用编排能力换质量提升。"}],"methodologies":[{"name":"合成「文字-画面」配对数据的方法","when_to_use":"从零训练图像/视频生成模型、且没有现成高质量配对数据时","steps":[{"title":"冷启动：人工详细描述","detail":"无 VLM 可用时，先让人按协议描述视频，要求详细到「一个盲人听完这段文字能在脑中重建画面」，覆盖所有物体、角色、交互、对话。"},{"title":"用人工数据训出 VLM","detail":"拿冷启动的人工标注训一个能看图/看视频说话的 VLM，作为后续大规模自动标注的工具。"},{"title":"VLM 大规模自动标注","detail":"用训好的 VLM 给海量采集来的图像/视频批量生成详细描述，规模化产出「文字-画面」配对。"},{"title":"混入少量无标注数据","detail":"保留一小部分不带文字的样本，让模型在没有文字指令时也能生成，提升泛化能力。"}],"pitfalls":["直接用 YouTube 标题/描述当配对——它们与画面几乎无关","描述不够细——模型会把简短指令理解得很字面，生成呆板","忘了音频对齐——音视频需要逐时间步对齐，比文字-画面严格得多"]},{"name":"视频推理提速：step distillation 与多法组合","when_to_use":"模型训好后要在生产环境低延迟、低成本地服务用户时","steps":[{"title":"先有一个慢但强的教师模型","detail":"flow matching 通常需约 100 步、扩散模型甚至上千步才能出好结果，先用它作为高质量教师。"},{"title":"蒸馏出少步数的学生模型","detail":"让只跑 10 步（甚至更少）的学生模型去学 100 步教师的输出，这就是 step distillation，区别于 LLM 的知识蒸馏。"},{"title":"叠加一致性模型与 GAN","detail":"结合 consistency model、distribution matching、GAN 判别器等多种方法，让模型只需学一个分布而非整个互联网分布，进一步压步数。"},{"title":"按任务难度定步数","detail":"生产中常只跑 4~8 步；图到图翻译等简单任务甚至 1 步即可（如 Cosmos Transfer）。"}],"pitfalls":["把训练侧的提速技巧误用到推理侧——两者是完全不同的故事","忽视 GAN：它才是 one-step 蒸馏的鼻祖，别只盯 consistency model","盲目追求 1 步——复杂生成任务步数砍太狠会掉质量"]},{"name":"用长 context 管理实现长时程视频","when_to_use":"要生成几分钟以上、且角色/场景/声音需保持一致的长视频时","steps":[{"title":"别只喂最后一帧","detail":"很多创作者把上一段的末帧当下一段首帧，多接几次质量就崩，因为模型没有完整时间上下文。"},{"title":"做带历史上下文的视频扩展","detail":"把之前生成的视频历史纳入上下文，让模型知道谁在说话、出现过哪些物体，再生成下一段（Grok Imagine video extension 即此思路）。"},{"title":"用 reference 图压缩上下文","detail":"允许上传最多 7 张参考图（角色/物体/场景），按需把对应内容拷进当前生成，避免把全部历史塞进 context。"},{"title":"对远端历史做启发式压缩","detail":"参考 FramePack：最近 1 秒保留完整历史，更早的历史压成更小的图，固定最大序列长度，避免 context 爆炸。"}],"pitfalls":["把全部历史视频 token 直接塞进 context——几十秒就到几十万甚至百万 token，必然爆炸","reference 图只是中间方案——7 张够用、100 个就需要全新机制","当前压缩多靠手工启发式——长期看会被模型自管理上下文取代"]}],"glossary":[{"term":"VAE","definition":"变分自编码器，把图像/视频压进连续 latent 空间再还原，是生成模型的「压缩器」。"},{"term":"latent space","definition":"压缩后的低维连续向量空间，模型在这里做生成而非在原始像素上。"},{"term":"diffusion transformer","definition":"生成式视觉模型的主流架构，靠反复去噪从噪声生成画面。"},{"term":"step distillation","definition":"把多步生成模型蒸馏成少步模型的技术，是视频推理提速的最大来源。"},{"term":"flow matching","definition":"一类生成式建模方法，常需约百步推理，是蒸馏的常见教师。"},{"term":"GAN","definition":"生成对抗网络，用判别器判断真假，是 one-step 生成的鼻祖。"},{"term":"prompt rewriter","definition":"把用户简短指令扩写成超详细描述的语言模型，视频智能很大程度来自它。"},{"term":"world model","definition":"Ethan 定义为实时、可交互、长时程的视频，可模拟世界供交互。"},{"term":"video extension","definition":"带完整历史上下文续生成视频的功能，是迈向长时程与交互的第一步。"},{"term":"reference-to-video","definition":"上传多张参考图作为条件来生成视频的功能，用于压缩长上下文。"},{"term":"SynthID","definition":"给生成内容打隐形水印的技术，原属 Google，现多家采用，但可被逆向去除。"},{"term":"video agent","definition":"用语言模型编排生成与编辑工具、能规划迭代产出长视频的系统。"},{"term":"temporal compression","definition":"沿时间维度压缩相邻帧的冗余，省 context 但牺牲实时性。"},{"term":"Grok Imagine","definition":"xAI 的多模态图像/视频生成产品，首发模型 0.9 即音视频联合生成。"}],"quick_start":["亲手试一次早期扩散模型（如 Stable Diffusion 1）感受逗号分隔、堆 4K/ultra-high-res 标签的「标签式」prompt，对比今天的自然语言 prompt","打开 Grok Imagine Agent（Beta）下一个「生成一分钟视频」的指令，观察它如何规划、调用生成模型并用 FFmpeg 拼接","读 OpenAI 的 sCM（simplified consistency models）论文，理解少步生成的统一思路","查一次 AWS S3 的存储 + egress 报价，按「10 亿条视频、每条 5MB」算一遍训练数据的存储与传输成本","读 FramePack 论文，看长视频如何用固定序列长度的启发式压缩历史上下文"],"further_reading":[{"type":"person","name":"Ethan He（@EthanHe_42）","note":"本期嘉宾，主导 NVIDIA Cosmos 与 xAI Grok Imagine，正转向 LLM 研究。"},{"type":"company","name":"NVIDIA Cosmos","note":"Ethan 主导的开源视频世界模型，文中大量技术细节的来源。"},{"type":"company","name":"xAI Grok Imagine","note":"三个月从零做出的多模态视频产品，含 reference-to-video、video extension、Agent 模式。"},{"type":"paper","name":"OpenAI sCM（simplified consistency models）","note":"swyx 称为 OpenAI 最惊艳的论文之一，少步生成的统一概念。"},{"type":"paper","name":"FramePack","note":"长视频上下文管理的启发式方案：近端保全历史、远端压缩。"},{"type":"paper","name":"Segment Anything（SAM）的 memory attention","note":"CV 跨时间维保持一致性的思路，被认为可借鉴到视频生成架构。"}]},"_familiar_mode":null,"quotes":[{"text":"the visual intelligence are actually mostly coming from language. these video models, especially from now, since the diffusion model technology is more mature, the every time you see there is some improvement on these models, I would say mostly, this, again, comes from language model, not coming from the vid- the video model itself","speaker":"嘉宾 Ethan He","timestamp":"01:13:31"},{"text":"a lot of the improvements does not come from new algorithms. It comes from finding small bugs here and there in the data pipeline, in the, in the model training pipeline. Those give, those give the biggest boost to the model quality.","speaker":"嘉宾 Ethan He","timestamp":"00:06:23"},{"text":"the data you need is a hundred percent synthetic pair of language and image or language to video. Because on the, on the internet, actually, the videos don't naturally associate with text.","speaker":"嘉宾 Ethan He","timestamp":"00:10:28"},{"text":"in the front-end, the diffusion model will actually be the front-end to show stuff to you. That's how I imagine it.","speaker":"嘉宾 Ethan He","timestamp":"00:25:50"},{"text":"Diffusion front-end, deterministic back-end.","speaker":"主持人 swyx","timestamp":"00:26:02"},{"text":"world model is like real-time interactive long horizon videos. So there are three parts.","speaker":"嘉宾 Ethan He","timestamp":"00:48:53"}],"chapters":[{"start":"00:00:00","title":"开场与从 NVIDIA Cosmos 到 xAI","summary":"Ethan 介绍自己从 NVIDIA Cosmos 世界模型转到 xAI、为追求更多算力而加入的经历。"},{"start":"00:03:24","title":"三个月从零做出 Grok Imagine","summary":"小团队靠强人才、低沟通成本和强基建，三个月做出首个多模态视频模型。"},{"start":"00:05:46","title":"迭代速度、算力与调试流水线","summary":"迭代次数决定训练速度；很多质量提升来自修数据和训练流水线里的小 bug；编程模型可能让算力重新成为瓶颈。"},{"start":"00:10:07","title":"图像与视频模型如何训练","summary":"讲合成「文字-画面」配对、人工冷启动标注、VLM 自动标注，以及 VAE/tokenizer 把像素压进 latent 的原理。"},{"start":"00:18:53","title":"视频压缩、VAE 与实时性权衡","summary":"对比 MP4 token 与 VAE，解释时间压缩省算力但牺牲实时交互的硬权衡。"},{"start":"00:22:10","title":"生成式 UI：Flipbook 与 Neural OS","summary":"实时生成 UI 的前沿应用：未来 diffusion 当前端、确定性逻辑当后端，用户意图直接到像素。"},{"start":"00:32:10","title":"训练大视频模型的真实成本","summary":"存储几十 PB 视频与特征、ingress/egress 比存储还贵，整体成本可比中等规模 LLM。"},{"start":"00:37:04","title":"推理提速：蒸馏、一致性模型与 GAN","summary":"step distillation 把步数砍到个位数，叠加 consistency model 与 GAN 进一步加速。"},{"start":"00:41:21","title":"音视频生成与 Grok Imagine 0.9","summary":"首个大规模部署的音视频联合生成模型；难点在音视频逐时间步对齐，且音乐是连续信号难离散化。"},{"start":"00:48:34","title":"什么是世界模型","summary":"Ethan 给出定义：实时、可交互、长时程的视频，并解释三者各自的瓶颈。"},{"start":"00:55:51","title":"长上下文、冗余与高效交互视频","summary":"video extension 与 reference 图如何解决长时程；长上下文管理在视频侧甚至领先 LLM。"},{"start":"01:00:11","title":"xAI 的被低估工作、文化与水印","summary":"xAI 技术被发布方式低估；文化是快速、目标极致、第一性原理；以及 SynthID 等水印的局限。"},{"start":"01:13:10","title":"Prompt 改写、视频 Agent 与辅助创作","summary":"视频智能大多来自 prompt rewriter 这一语言模型；视频 Agent 把生成与编辑工具编排起来产出长视频。"},{"start":"01:27:32","title":"为什么语言模型解锁更好的视频","summary":"视频能力提升主要来自语言模型变聪明；Agent 能调用各种确定性工具，无需把所有能力塞进生成模型。"},{"start":"01:31:15","title":"机器人、物理 AI 与具身世界模型","summary":"Ethan 认为物理 AI 可能不必真在现实世界中训练，强视频能力的 LLM 把机器人当工具即可。"},{"start":"01:32:38","title":"为什么离开 xAI 及自管理上下文的未来","summary":"为做公司里做不了的 LLM 研究而离开；下一前沿是模型自感知并自管理上下文，甚至在测试时改写自己的 harness。"},{"start":"01:38:43","title":"职业路径与结语","summary":"Ethan 回顾从 ResNet、FAIR 自监督到 Cosmos、MoE、xAI 的多次转型，认为 ML 内部换方向比想象中容易。"}],"references":{"glossary":[{"term":"VAE","definition":"变分自编码器，把图像/视频压进连续 latent 空间再还原，是生成模型的「压缩器」。"},{"term":"latent space","definition":"压缩后的低维连续向量空间，模型在这里做生成而非在原始像素上。"},{"term":"diffusion transformer","definition":"生成式视觉模型的主流架构，靠反复去噪从噪声生成画面。"},{"term":"step distillation","definition":"把多步生成模型蒸馏成少步模型的技术，是视频推理提速的最大来源。"},{"term":"flow matching","definition":"一类生成式建模方法，常需约百步推理，是蒸馏的常见教师。"},{"term":"GAN","definition":"生成对抗网络，用判别器判断真假，是 one-step 生成的鼻祖。"},{"term":"prompt rewriter","definition":"把用户简短指令扩写成超详细描述的语言模型，视频智能很大程度来自它。"},{"term":"world model","definition":"Ethan 定义为实时、可交互、长时程的视频，可模拟世界供交互。"},{"term":"video extension","definition":"带完整历史上下文续生成视频的功能，是迈向长时程与交互的第一步。"},{"term":"reference-to-video","definition":"上传多张参考图作为条件来生成视频的功能，用于压缩长上下文。"},{"term":"SynthID","definition":"给生成内容打隐形水印的技术，原属 Google，现多家采用，但可被逆向去除。"},{"term":"video agent","definition":"用语言模型编排生成与编辑工具、能规划迭代产出长视频的系统。"},{"term":"temporal compression","definition":"沿时间维度压缩相邻帧的冗余，省 context 但牺牲实时性。"},{"term":"Grok Imagine","definition":"xAI 的多模态图像/视频生成产品，首发模型 0.9 即音视频联合生成。"}],"further_reading":[{"type":"person","name":"Ethan He（@EthanHe_42）","note":"本期嘉宾，主导 NVIDIA Cosmos 与 xAI Grok Imagine，正转向 LLM 研究。"},{"type":"company","name":"NVIDIA Cosmos","note":"Ethan 主导的开源视频世界模型，文中大量技术细节的来源。"},{"type":"company","name":"xAI Grok Imagine","note":"三个月从零做出的多模态视频产品，含 reference-to-video、video extension、Agent 模式。"},{"type":"paper","name":"OpenAI sCM（simplified consistency models）","note":"swyx 称为 OpenAI 最惊艳的论文之一，少步生成的统一概念。"},{"type":"paper","name":"FramePack","note":"长视频上下文管理的启发式方案：近端保全历史、远端压缩。"},{"type":"paper","name":"Segment Anything（SAM）的 memory attention","note":"CV 跨时间维保持一致性的思路，被认为可借鉴到视频生成架构。"}]}}</script>

<script type="module">
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const root = document.getElementById('root');
  const tocEl = document.getElementById('toc');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sections = [];

  let sectionCounter = 0;
  const section = (id, label, inner, opts = {}) => {
    sectionCounter++;
    sections.push({ id, label });
    const subhead = opts.subhead
      ? `<div class="section-subhead">${esc(opts.subhead)}</div>` : '';
    return `<section id="${id}">
      <div class="section-heading">
        <span class="num">${String(sectionCounter).padStart(2, '0')}</span>
        <span>${esc(label)}</span>
      </div>
      ${subhead}
      ${inner}
    </section>`;
  };

  const formatDuration = (sec) => {
    if (!sec) return '';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return h ? `${h}h${m}m` : `${m}m`;
  };

  // ===== Hero =====
  const meta = data.meta || {};
  const modeBadge = meta.mode === 'unfamiliar'
    ? '<span class="mode-badge">陌生领域 · 系统性学习</span>'
    : meta.mode === 'familiar'
    ? '<span class="mode-badge">熟悉领域 · 增量获取</span>'
    : '';

  const transcriptBadge = meta.transcript_source
    ? `<span class="ui text-xs text-muted">📜 ${esc(meta.transcript_source)}</span>` : '';

  const metaBits = [
    meta.duration && `<span class="text-muted ui text-sm">⏱ ${esc(meta.duration)}</span>`,
    meta.publish_date && `<span class="text-muted ui text-sm">📅 ${esc(meta.publish_date)}</span>`,
    meta.domain && `<span class="text-muted ui text-sm">🏷 ${esc(meta.domain)}</span>`,
    meta.language && `<span class="text-muted ui text-sm">🌐 ${esc(meta.language).toUpperCase()}</span>`,
  ].filter(Boolean).join(' · ');

  const speakers = Array.isArray(meta.speakers) && meta.speakers.length
    ? `<div class="ui text-sm text-muted mt-3">🎙 ${meta.speakers.map(esc).join(' · ')}</div>` : '';

  const sourceLink = meta.source_url
    ? `<a href="${esc(meta.source_url)}" target="_blank" class="ui text-sm accent hover:underline">原始链接 →</a>` : '';

  const heroHTML = `
    <header class="space-y-4 pb-8" style="border-bottom: 1px solid var(--border);">
      <div class="flex items-center gap-3 flex-wrap">
        ${modeBadge}
        ${transcriptBadge}
      </div>
      <h1 class="hero-title text-4xl md:text-5xl">${esc(meta.title || 'Podcast Report')}</h1>
      <div class="flex flex-wrap gap-x-1 gap-y-1 items-center">${metaBits}</div>
      ${speakers}
      <div class="pt-2">${sourceLink}</div>
    </header>`;

  // ===== TLDR =====
  let tldrHTML = '';
  if (data.tldr) {
    tldrHTML = section('tldr', '一句话总结',
      `<div class="tldr-block">${esc(data.tldr)}</div>`);
  }

  // ===== Core Questions =====
  let questionsHTML = '';
  if (Array.isArray(data.core_questions) && data.core_questions.length) {
    questionsHTML = section('questions', '核心问题',
      data.core_questions.map((q, i) => `
        <div class="question-card">
          <span class="question-num">问题 ${String(i+1).padStart(2,'0')}</span>
          <div class="question-text">${esc(q.question)}</div>
          ${q.approach ? `
            <div class="question-approach">
              <span class="label-pill">分析思路</span>
              ${esc(q.approach)}
            </div>` : ''}
          ${q.answer ? `
            <div class="question-answer">
              <span class="label-pill">作者答案</span>
              ${esc(q.answer)}
            </div>` : ''}
        </div>`).join(''),
      { subhead: '不是结论清单，是嘉宾真正在回答的问题。读完每条你应该能复述他的思路。' }
    );
  } else if (Array.isArray(data.key_takeaways) && data.key_takeaways.length) {
    // 向后兼容老 schema
    questionsHTML = section('takeaways', '核心收获',
      `<ol class="space-y-3 list-none p-0">
        ${data.key_takeaways.map((t, i) => `
          <li class="premise"><div class="premise-point">${i+1}. ${esc(t)}</div></li>`).join('')}
      </ol>`);
  }

  // ===== Slides Gallery (for video lectures with extracted frames) =====
  // v3.6 watch-mode: slide_type badge + visual_text code block + slide-id anchor
  let slidesHTML = '';
  if (Array.isArray(data.slides) && data.slides.length) {
    const slideId = (file) => {
      // 'slides/slide-0007.jpg' → 'slide-0007'
      const m = (file || '').match(/([^\/]+?)\.[^.]+$/);
      return m ? m[1] : '';
    };
    slidesHTML = section('slides', '关键画面',
      `<div class="slides-grid">
        ${data.slides.map(s => {
          const sid = slideId(s.file);
          const typeBadge = s.slide_type
            ? `<span class="slide-type-badge ${esc(s.slide_type)}">${esc(s.slide_type)}</span>` : '';
          const visualText = s.visual_text
            ? `<div class="visual-text"><span class="visual-text-label">屏幕内容（讲者未口述）</span>${esc(s.visual_text)}</div>` : '';
          const captionText = s.caption || s.note || '';
          return `<figure class="slide-card" id="${esc(sid)}">
            <img src="${esc(s.file)}" alt="${esc(captionText)}" loading="lazy">
            <figcaption>
              ${s.timestamp_human ? `<span class="slide-time">${esc(s.timestamp_human)}</span>` : ''}
              ${typeBadge}
              ${captionText ? `<span class="slide-caption">${esc(captionText)}</span>` : ''}
            </figcaption>
            ${visualText}
          </figure>`;
        }).join('')}
      </div>`,
      { subhead: `共 ${data.slides.length} 张 · scene-change 抽取 · 标 slide_type 后 Claude 多模态阅读 · 含视觉证据 visual_text` }
    );
  }

  // Helper: render visual_refs as small slide anchors
  const renderVisualRefs = (refs) => {
    if (!Array.isArray(refs) || !refs.length) return '';
    return `<div class="visual-refs">
      <span class="label">视觉证据</span>
      ${refs.map(r => `<a href="#${esc(r)}">${esc(r)}</a>`).join('')}
    </div>`;
  };

  // ===== Chapters Timeline =====
  let chaptersHTML = '';
  if (Array.isArray(data.chapters) && data.chapters.length) {
    chaptersHTML = section('chapters', '章节时间线',
      `<div class="timeline-list">
        ${data.chapters.map(c => `
          <div class="timeline-item">
            <div class="timeline-time mono">${esc(c.start)}</div>
            <div class="timeline-title">${esc(c.title)}</div>
            ${c.summary ? `<div class="timeline-summary">${esc(c.summary)}</div>` : ''}
          </div>`).join('')}
      </div>`,
      { subhead: `共 ${data.chapters.length} 段 · 时长约 ${esc(meta.duration || '?')} · 用来快速跳读` }
    );
  }

  // ===== Unfamiliar mode =====
  let unfamiliarHTML = '';
  const u = data._unfamiliar_mode;
  if (u && meta.mode === 'unfamiliar') {
    let bits = '';

    if (Array.isArray(u.basics) && u.basics.length) {
      bits += section('basics', '基础共识',
        `<div class="space-y-0">
          ${u.basics.map(b => `
            <div class="premise">
              <div class="premise-point">${esc(b.point)}</div>
              <div class="premise-explanation">${esc(b.explanation)}</div>
              ${renderVisualRefs(b.visual_refs)}
            </div>`).join('')}
        </div>`,
        { subhead: '该领域圈内人都默认同意的前提。读完应该没有「这是什么」的问题。' }
      );
    }

    const models = u.mental_models || u.frameworks;
    if (Array.isArray(models) && models.length) {
      bits += section('mental-models', '心智模型',
        models.map((m, i) => `
          <div class="mental-block">
            <div class="mental-name">${String(i+1).padStart(2,'0')} · ${esc(m.name)}</div>
            <div class="mental-description">${esc(m.description)}</div>
            ${m.mermaid ? `
              <div class="mermaid-frame">
                <div class="mermaid" data-id="mm-${i}">${esc(m.mermaid)}</div>
              </div>
              <div class="mermaid-caption">图：${esc(m.name)}</div>
            ` : ''}
            ${m.how_to_apply ? `
              <div class="application-callout">
                <div class="label">如何应用</div>
                <div>${esc(m.how_to_apply)}</div>
              </div>` : ''}
            ${renderVisualRefs(m.visual_refs)}
          </div>`).join(''),
        { subhead: '单个核心概念的深度解读 · 用图说话 · 强调"换个角度看见问题"。' }
      );
    }

    const playbooks = u.playbooks || u.methodologies;
    if (Array.isArray(playbooks) && playbooks.length) {
      bits += section('playbooks', '执行手册',
        playbooks.map(p => `
          <div class="playbook-block">
            <div class="playbook-name">${esc(p.name)}</div>
            ${p.when_to_use ? `<div class="playbook-when">何时用：${esc(p.when_to_use)}</div>` : ''}
            <ol class="step-list">
              ${(p.steps||[]).map(s => `
                <li class="step-item">
                  <div class="step-title">${esc(s.title)}</div>
                  <div class="step-detail">${esc(s.detail)}</div>
                </li>`).join('')}
            </ol>
            ${Array.isArray(p.pitfalls) && p.pitfalls.length ? `
              <div class="pitfalls-box">
                <div class="label">常见坑</div>
                <ul>${p.pitfalls.map(pt => `<li>${esc(pt)}</li>`).join('')}</ul>
              </div>` : ''}
            ${renderVisualRefs(p.visual_refs)}
          </div>`).join(''),
        { subhead: '可上手照做的多步骤流程 · 含适用场景和坑。' }
      );
    }

    if (Array.isArray(u.quick_start) && u.quick_start.length) {
      bits += section('quickstart', '快速应用',
        `<div>
          ${u.quick_start.map(q => `
            <div class="quickstart-item">
              <span class="check">✓</span>
              <span>${esc(q)}</span>
            </div>`).join('')}
        </div>`,
        { subhead: '下周可以立刻做的事 · 具体到一个动作。' }
      );
    }

    unfamiliarHTML = bits;
  }

  // ===== Familiar mode =====
  let familiarHTML = '';
  const f = data._familiar_mode;
  if (f && meta.mode === 'familiar') {
    let bits = '';
    if (Array.isArray(f.increments) && f.increments.length) {
      bits += section('increments', '增量信息',
        f.increments.map(i => `
          <div class="premise">
            <div class="premise-point">${esc(i.fact)}</div>
            <div class="premise-explanation">
              <span class="label-pill" style="display:inline;">为什么新</span>
              ${esc(i.why_new)}
              ${i.source_timestamp ? `<span class="mono text-muted ml-3">⏱ ${esc(i.source_timestamp)}</span>` : ''}
            </div>
          </div>`).join(''),
        { subhead: '该领域的新数据、新案例 · 标注"为什么这是新的"。' }
      );
    }
    if (Array.isArray(f.new_takes) && f.new_takes.length) {
      bits += section('new-takes', '新观点',
        f.new_takes.map(t => `
          <div class="premise">
            <div class="premise-point">${esc(t.take)}</div>
            <div class="premise-explanation">
              <span class="label-pill" style="display:inline;">vs 主流</span>
              ${esc(t.vs_mainstream)}
            </div>
          </div>`).join(''),
        { subhead: '反共识或不同角度的看法。' }
      );
    }
    if (Array.isArray(f.new_approaches) && f.new_approaches.length) {
      bits += section('approaches', '新思路',
        f.new_approaches.map(a => `
          <div class="premise">
            <div class="premise-point">${esc(a.approach)}</div>
            <div class="premise-explanation">适用：${esc(a.applicable_to)}</div>
          </div>`).join('')
      );
    }
    if (Array.isArray(f.insights) && f.insights.length) {
      bits += section('insights', '启发',
        f.insights.map(i => `
          <div class="premise" style="border-left-color: var(--accent);">
            <div class="premise-point">💡 ${esc(i.insight)}</div>
            ${i.implications ? `<div class="premise-explanation">${esc(i.implications)}</div>` : ''}
          </div>`).join('')
      );
    }
    if (Array.isArray(f.tensions) && f.tensions.length) {
      bits += section('tensions', '冲突点',
        f.tensions.map(t => `
          <div class="playbook-block">
            <div class="playbook-name">${esc(t.point)}</div>
            <div class="grid md:grid-cols-2 gap-4 mt-4">
              <div class="p-4 rounded" style="background: var(--border-soft);">
                <span class="label-pill">你的认知</span>
                <div class="text-sm" style="color: var(--fg-secondary);">${esc(t.your_prior)}</div>
              </div>
              <div class="p-4 rounded accent-bg">
                <span class="label-pill">播客观点</span>
                <div class="text-sm">${esc(t.podcast_view)}</div>
              </div>
            </div>
          </div>`).join('')
      );
    }
    if (Array.isArray(f.open_questions) && f.open_questions.length) {
      bits += section('open-questions', '待深挖问题',
        `<div>
          ${f.open_questions.map(q => `
            <div class="quickstart-item">
              <span class="check">?</span>
              <span>${esc(q)}</span>
            </div>`).join('')}
        </div>`
      );
    }
    familiarHTML = bits;
  }

  // ===== Quotes (top 3) =====
  let quotesHTML = '';
  if (Array.isArray(data.quotes) && data.quotes.length) {
    const topQuotes = data.quotes.slice(0, 3);
    quotesHTML = section('quotes', '金句',
      topQuotes.map(q => `
        <div class="pullquote">
          <div class="pullquote-text">${esc(q.text)}</div>
          <div class="pullquote-attribution ui">
            — ${esc(q.speaker || '匿名')}${q.timestamp ? ` · <span class="mono">${esc(q.timestamp)}</span>` : ''}
          </div>
        </div>`).join(''),
      { subhead: '只选 3 句最有代表性的 · 信噪比第一。' }
    );
  }

  // ===== References =====
  let referencesHTML = '';
  const refs = data.references || {};
  const glossary = refs.glossary || (u && u.glossary) || [];
  const furtherReading = refs.further_reading || (u && u.further_reading) || [];
  if (glossary.length || furtherReading.length) {
    let inner = '';
    if (glossary.length) {
      inner += `
        <div class="mb-8 references-block">
          <div class="ui text-xs uppercase tracking-wider text-muted mb-3" style="letter-spacing: 0.08em;">术语表</div>
          <div>
            ${glossary.map(g => `
              <div class="glossary-row">
                <div class="glossary-term">${esc(g.term)}</div>
                <div class="glossary-definition">${esc(g.definition)}
                  ${renderVisualRefs(g.visual_refs)}
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    }
    if (furtherReading.length) {
      inner += `
        <div class="references-block">
          <div class="ui text-xs uppercase tracking-wider text-muted mb-3" style="letter-spacing: 0.08em;">延伸阅读</div>
          <div>
            ${furtherReading.map(r => `
              <div class="reading-item">
                <span class="reading-type">${esc(r.type)}</span>
                <div>
                  <div class="reading-name">${esc(r.name)}</div>
                  ${r.note ? `<div class="reading-note">${esc(r.note)}</div>` : ''}
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    }
    referencesHTML = section('references', '参考资料', inner,
      { subhead: '术语表 + 延伸阅读 · 末尾参考用。' });
  }

  root.innerHTML = heroHTML + tldrHTML + questionsHTML + slidesHTML + chaptersHTML + unfamiliarHTML + familiarHTML + quotesHTML + referencesHTML;

  tocEl.innerHTML = sections.map((s, i) => `
    <a href="#${s.id}" class="toc-link">
      <span class="mono text-muted" style="font-size: 11px;">${String(i+1).padStart(2,'0')}</span>
      &nbsp;${esc(s.label)}
    </a>`).join('');

  renderFlowcharts(root);

  const links = Array.from(tocEl.querySelectorAll('a'));
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('section[id]').forEach(s => observer.observe(s));

  // ====== 流程图渲染器:flowchart 源码 → 卡片 + SVG 箭头(替代 mermaid) ======
  function renderFlowcharts(scope) {
    (scope || document).querySelectorAll('.mermaid').forEach(function (host) {
      if (host.dataset.fcDone) return;
      const src = host.textContent || '';
      const head = src.trim().split('\n')[0].trim();
      if (!/^(flowchart|graph)\s+/i.test(head)) return; // 只处理流程图,其它原样留着
      const g = fcParse(src);
      if (!g || g.order.length === 0) return;
      host.dataset.fcDone = '1';
      fcDraw(host, g);
    });
  }

  function fcParse(src) {
    const lines = src.trim().split('\n');
    let dir = 'TD';
    const nodes = {}, order = [], edges = [];
    function tok(t) {
      t = t.trim();
      const m = t.match(/^([A-Za-z0-9_]+)\s*(?:\[([^\]]*)\]|\{([^}]*)\}|\(([^)]*)\))?$/);
      if (!m) return null;
      const id = m[1];
      const label = (m[2] != null ? m[2] : m[3] != null ? m[3] : m[4]);
      const shape = m[3] != null ? 'decision' : 'rect';
      if (!nodes[id]) { nodes[id] = { id: id, label: label || id, shape: shape }; order.push(id); }
      else if (label) { nodes[id].label = label; if (shape === 'decision') nodes[id].shape = 'decision'; }
      return id;
    }
    lines.forEach(function (raw) {
      const line = raw.trim();
      if (!line) return;
      const fm = line.match(/^(?:flowchart|graph)\s+(TD|TB|LR|RL)/i);
      if (fm) { dir = fm[1].toUpperCase(); return; }
      const em = line.match(/^(.+?)\s*--+>\s*(?:\|([^|]*)\|\s*)?(.+)$/);
      if (em) { const a = tok(em[1]); const b = tok(em[3]); if (a && b) edges.push({ a: a, b: b, lbl: (em[2] || '').trim() }); }
      else { tok(line); }
    });
    return { dir: dir === 'TB' ? 'TD' : dir, nodes: nodes, order: order, edges: edges };
  }

  function fcLayers(g) {
    const L = {}; g.order.forEach(function (id) { L[id] = 0; });
    let changed = true, guard = 0;
    while (changed && guard++ < 300) {
      changed = false;
      g.edges.forEach(function (e) { if (L[e.b] < L[e.a] + 1) { L[e.b] = L[e.a] + 1; changed = true; } });
    }
    const layers = [];
    g.order.forEach(function (id) { (layers[L[id]] = layers[L[id]] || []).push(id); });
    return layers;
  }

  function fcDraw(host, g) {
    const lr = (g.dir === 'LR' || g.dir === 'RL');
    const layers = fcLayers(g);
    host.textContent = '';
    host.style.position = 'relative';
    host.style.width = '100%';
    const SVGNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible';
    const mid = 'fcah' + Math.random().toString(36).slice(2);
    const defs = document.createElementNS(SVGNS, 'defs');
    defs.innerHTML = '<marker id="' + mid + '" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="context-stroke"/></marker>';
    svg.appendChild(defs);
    host.appendChild(svg);

    const flow = document.createElement('div');
    flow.style.cssText = 'position:relative;z-index:1;display:flex;gap:' + (lr ? '48px' : '32px') + ';' +
      (lr ? 'flex-direction:row;align-items:center' : 'flex-direction:column;align-items:stretch');
    const el = {};
    layers.forEach(function (layer) {
      const band = document.createElement('div');
      band.style.cssText = 'display:flex;gap:18px;justify-content:center;flex-wrap:wrap;' + (lr ? 'flex-direction:column' : 'flex-direction:row');
      (layer || []).forEach(function (id) {
        const n = g.nodes[id];
        const dec = n.shape === 'decision';
        const card = document.createElement('div');
        card.style.cssText = 'box-sizing:border-box;width:' + (lr ? '160px' : '200px') + ';padding:11px 14px;border-radius:' +
          (dec ? '13px' : '10px') + ';font-size:13.5px;line-height:1.5;background:' + (dec ? 'var(--accent-bg)' : 'var(--bg-card)') +
          ';color:var(--fg);border:1px solid ' + (dec ? 'var(--accent)' : 'var(--border)') + ';' +
          (dec ? '' : 'border-left:3px solid var(--accent);') +
          'box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 18px -12px rgba(0,0,0,.22);text-align:' + (dec ? 'center' : 'left') + ';white-space:normal';
        card.innerHTML = (dec ? '<div style="font:600 10px var(--sans);letter-spacing:.1em;color:var(--accent);opacity:.85;margin-bottom:3px">判断</div>' : '') +
          fcEsc(n.label).replace(/&lt;br\s*\/?&gt;/gi, '<br>');
        band.appendChild(card);
        el[id] = card;
      });
      flow.appendChild(band);
    });
    host.appendChild(flow);

    function draw() {
      const hb = host.getBoundingClientRect();
      if (!hb.width) return;
      svg.setAttribute('viewBox', '0 0 ' + hb.width + ' ' + hb.height);
      Array.prototype.forEach.call(svg.querySelectorAll('.fce'), function (n) { n.remove(); });
      g.edges.forEach(function (e) {
        const A = el[e.a], B = el[e.b]; if (!A || !B) return;
        const a = A.getBoundingClientRect(), b = B.getBoundingClientRect();
        let x1, y1, x2, y2, d;
        if (lr) { x1 = a.right - hb.left; y1 = a.top + a.height / 2 - hb.top; x2 = b.left - hb.left; y2 = b.top + b.height / 2 - hb.top; const mx = (x1 + x2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + (x2 - 2) + ',' + y2; }
        else { x1 = a.left + a.width / 2 - hb.left; y1 = a.bottom - hb.top; x2 = b.left + b.width / 2 - hb.left; y2 = b.top - hb.top; const my = (y1 + y2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + (y2 - 2); }
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('class', 'fce'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
        p.style.stroke = 'var(--muted-soft)'; p.setAttribute('stroke-width', '1.7'); p.setAttribute('marker-end', 'url(#' + mid + ')');
        svg.appendChild(p);
        if (e.lbl) {
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, tw = e.lbl.length * 13 + 14;
          const r = document.createElementNS(SVGNS, 'rect');
          r.setAttribute('class', 'fce'); r.setAttribute('x', mx - tw / 2); r.setAttribute('y', my - 11); r.setAttribute('width', tw); r.setAttribute('height', 21); r.setAttribute('rx', 10);
          r.style.fill = 'var(--bg)'; r.style.stroke = 'var(--border)';
          const t = document.createElementNS(SVGNS, 'text');
          t.setAttribute('class', 'fce'); t.setAttribute('x', mx); t.setAttribute('y', my + 4); t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12.5');
          t.style.fill = 'var(--muted)'; t.setAttribute('font-family', 'var(--sans)'); t.textContent = e.lbl;
          svg.appendChild(r); svg.appendChild(t);
        }
      });
    }
    requestAnimationFrame(function () { requestAnimationFrame(draw); });
    if (window.ResizeObserver) { new ResizeObserver(function () { requestAnimationFrame(draw); }).observe(host); }
    window.addEventListener('resize', draw);
  }

  function fcEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
</script>

<script>
(function(){
var p=document.getElementById('mtprog'),tb=document.getElementById('mttoc'),
    tp=document.getElementById('mttop'),sh=document.getElementById('mtsheet'),
    ln=document.getElementById('mtlinks');
function onScroll(){
  var d=document.documentElement,m=d.scrollHeight-window.innerHeight,y=window.scrollY;
  p.style.width=(m>0?Math.min(100,y/m*100):0)+'%';
  tp.classList.toggle('show',y>600);
  document.documentElement.classList.toggle('mt-scrolled',y>80);
}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
tp.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
function fill(){
  ln.innerHTML='';var seen={};
  var as=document.querySelectorAll('#toc a[href^="#"], nav a[href^="#"]');
  for(var i=0;i<as.length;i++){
    var a=as[i],h=a.getAttribute('href');
    if(!h||h==='#'||h==='#top'||seen[h])continue;
    if(!document.getElementById(h.slice(1)))continue;
    seen[h]=1;
    var b=document.createElement('a');b.href=h;
    b.textContent=a.textContent.replace(/\s+/g,' ').trim();
    b.addEventListener('click',function(){sh.hidden=true});
    ln.appendChild(b);
  }
  if(!ln.children.length){
    var b2=document.createElement('a');b2.href='#top';b2.textContent='回到顶部';
    b2.addEventListener('click',function(){sh.hidden=true});ln.appendChild(b2);
  }
}
tb.addEventListener('click',function(){fill();sh.hidden=false});
sh.addEventListener('click',function(e){if(e.target===sh)sh.hidden=true});
document.getElementById('mtclose').addEventListener('click',function(){sh.hidden=true});
function polish(){
  document.querySelectorAll('a').forEach(function(a){
    if(a.textContent.replace(/\s+/g,' ').trim()===('AI Podcast '+'Listener')){
      a.textContent='Valley Beacon 深读';
      a.setAttribute('aria-label','Valley Beacon 深读');
    }
  });
  var raw=document.getElementById('report-data');
  if(!raw) return;
  var data;
  try{data=JSON.parse(raw.textContent)}catch(e){return}
  var meta=data.meta||{};
  if(!meta.original_title||meta.original_title===meta.title) return;
  function insertOriginal(){
    if(document.querySelector('.mt-original-title')) return;
    var h=document.querySelector('.hero-title,h1');
    if(!h) return;
    var p=document.createElement('p');
    p.className='mt-original-title';
    p.textContent=meta.original_title;
    h.insertAdjacentElement('afterend',p);
  }
  insertOriginal();
  requestAnimationFrame(insertOriginal);
  setTimeout(insertOriginal,300);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',polish);
else polish();
})();
</script>
